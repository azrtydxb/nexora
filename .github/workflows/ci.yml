          umask 077
          ca_dir=$(mktemp -d "$RUNNER_TEMP/nexora-ca.XXXXXX")
          trap 'rm -rf "$ca_dir"' EXIT
          printf '%s\n' "$NEXORA_CI_CA_PEM" >"$ca_dir/input.pem"
          unset NEXORA_CI_CA_PEM
          # Reject additional objects, keys, trailing garbage and multiple certificates.
          awk '
            /^-----BEGIN CERTIFICATE-----$/ { if (state != 0) exit 1; state=1; next }
            /^-----END CERTIFICATE-----$/ { if (state != 1) exit 1; state=2; next }
            state == 1 { if ($0 !~ /^[A-Za-z0-9+\/=]+$/) exit 1; next }
            /[^[:space:]]/ { exit 1 }
            END { if (state != 2) exit 1 }
          ' "$ca_dir/input.pem" || fail_ca
          openssl x509 -in "$ca_dir/input.pem" -out "$ca_dir/cluster-ca.crt" 2>/dev/null || fail_ca
          openssl x509 -in "$ca_dir/cluster-ca.crt" -noout -ext basicConstraints 2>/dev/null | grep -E '^[[:space:]]*CA:TRUE(, pathlen:[0-9]+)?[[:space:]]*$' >/dev/null || fail_ca
          openssl verify -check_ss_sig -CAfile "$ca_dir/cluster-ca.crt" "$ca_dir/cluster-ca.crt" >/dev/null 2>&1 || fail_ca
          # Keep public roots; install only a job-private bundle, never change host/cluster trust.
          cat /etc/ssl/certs/ca-certificates.crt "$ca_dir/cluster-ca.crt" >"$ca_dir/ca-bundle.crt"
          rm "$ca_dir/input.pem"
          {
          	echo "NEXORA_CI_CA_FILE=$ca_dir/cluster-ca.crt"
          	echo "NODE_EXTRA_CA_CERTS=$ca_dir/cluster-ca.crt"
          	echo "CARGO_HTTP_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "SSL_CERT_FILE=$ca_dir/ca-bundle.crt"
          	echo "GIT_SSL_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "CURL_CA_BUNDLE=$ca_dir/ca-bundle.crt"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1
      # The checkout is owned by the runner user, not the container's root; without this git (and
      # go build's VCS stamping) refuses the repository as dubious ownership.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Go build and module caches. The pod is ephemeral, so /tmp/cache starts empty every run.
      # Keyed on the toolbox image and go.sum, not the run, so main uploads only when dependencies
      # or the toolchain change (the GitHub cache is behind the home uplink). The Go build cache
      # is content-addressed, so an older entry can only cost a rebuild, never a stale result.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cache/go-build
            /tmp/cache/gomod
          key: go-toolbox-2-mgmt-${{ hashFiles('go.sum', 'operator/go.sum') }}
          restore-keys: go-toolbox-2-mgmt-
      - run: make webui-placeholder
      - name: gofmt
        run: test -z "$(gofmt -l mgmt e2e bench | tee /dev/stderr)"
      - run: go vet ./...
      # TestOIDCLoginAndProviderDown starts the OIDC fixture, which the harness finds in bin/.
      # PostgreSQL-backed tests run as the image's `dev` user (PostgreSQL refuses root).
      - run: go build -o bin/nexora-fixture ./e2e/fixtures/cmd/nexora-fixture
      - name: Management, control, deployment and harness race tests
        run: |
          mkdir -p artifacts
          make ci-race 2>&1 | tee artifacts/race.log
      # Only trusted main pushes write the cache; PRs restore from it.
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cache/go-build
            /tmp/cache/gomod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - name: Retain raw race output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-race
          path: artifacts/
          retention-days: 7

  operator:
    # Heavy operator tests (~12m): integration tier + full tier only.
