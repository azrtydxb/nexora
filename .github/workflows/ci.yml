      # The checkout is owned by the runner user, not the container's root; without this git (and
      # go build's VCS stamping) refuses the repository as dubious ownership.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Web checks and M8 unit tests
        run: |
          mkdir -p artifacts
          make web-test web-unit-test 2>&1 | tee artifacts/web.log
      - name: Retain web output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-web
          path: |
            artifacts/
            web/test-results/
          retention-days: 7

  failover-contracts:
    runs-on: arc-azrtydxb
    container:
      image: "ant.azrty.com/ci-images/nexora-dev:toolbox-2"
      # Fixtures drop PostgreSQL to dev; prerequisite package installation needs root.
      options: --user 0
    # The toolbox job container comes from the anonymous-read ci-images feed on the OKE
    # Ant (same cluster as the runners). It used to come from the kw Nexus name, which
    # took 15-30 minutes to pull; the generous timeout is kept as headroom.
    timeout-minutes: 35
    steps:
      - name: Install provisioned CI CA
        env:
          NEXORA_CI_CA_PEM: ${{ secrets.NEXORA_CI_CA_PEM }}
        run: |
          set +x
          set -euo pipefail
          fail_ca() {
          	echo 'Trusted CI CA missing, invalid, or unavailable; parent provisioning required.' >&2
