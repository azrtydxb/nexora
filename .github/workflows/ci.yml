name: ci
on:
  push: { branches: [main] }
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every job runs on the arm64 ARC scale set inside the dev toolbox image (deploy/dev/Dockerfile:
# Rust 1.97, Go 1.27, Node 26 + pnpm, protoc, PostgreSQL 17, dnsperf), because the runner image
# carries no toolchains. The image's /work paths only exist in the dev pod, so caches move to /tmp.
defaults:
  run:
    shell: bash
env:
  CARGO_TARGET_DIR: /tmp/target
  GOCACHE: /tmp/cache/go-build
  GOMODCACHE: /tmp/cache/gomod
  PNPM_HOME: /tmp/cache/pnpm
  GOPROXY: https://192.168.10.131:8443/repository/golang/,direct
jobs:
  engine:
    runs-on: arc-azrtydxb
    container:
      image: "192.168.10.131/azrtydxb/nexora-dev:toolbox-2"
      # Fixtures drop PostgreSQL to dev; prerequisite package installation needs root.
      options: --user 0
    timeout-minutes: 45
    steps:
      # Bootstrap before checkout; the bundle preserves public trust roots.
      - name: Install provisioned CI CA
        env:
          NEXORA_CI_CA_PEM: ${{ secrets.NEXORA_CI_CA_PEM }}
        run: |
          set +x
          set -euo pipefail
          fail_ca() {
          	echo 'Trusted CI CA missing, invalid, or unavailable; parent provisioning required.' >&2
          	exit 1
          }
          [[ -n ${NEXORA_CI_CA_PEM:-} ]] || fail_ca
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          umask 077
          ca_dir=$(mktemp -d "$RUNNER_TEMP/nexora-ca.XXXXXX")
          trap 'rm -rf "$ca_dir"' EXIT
          printf '%s\n' "$NEXORA_CI_CA_PEM" >"$ca_dir/input.pem"
          unset NEXORA_CI_CA_PEM
          # Reject additional objects, keys, trailing garbage and multiple certificates.
          awk '
            /^-----BEGIN CERTIFICATE-----$/ { if (state != 0) exit 1; state=1; next }
            /^-----END CERTIFICATE-----$/ { if (state != 1) exit 1; state=2; next }
            state == 1 { if ($0 !~ /^[A-Za-z0-9+\/=]+$/) exit 1; next }
            /[^[:space:]]/ { exit 1 }
            END { if (state != 2) exit 1 }
          ' "$ca_dir/input.pem" || fail_ca
          openssl x509 -in "$ca_dir/input.pem" -out "$ca_dir/cluster-ca.crt" 2>/dev/null || fail_ca
          openssl x509 -in "$ca_dir/cluster-ca.crt" -noout -ext basicConstraints 2>/dev/null | grep -E '^[[:space:]]*CA:TRUE(, pathlen:[0-9]+)?[[:space:]]*$' >/dev/null || fail_ca
          openssl verify -check_ss_sig -CAfile "$ca_dir/cluster-ca.crt" "$ca_dir/cluster-ca.crt" >/dev/null 2>&1 || fail_ca
          # Keep public roots; install only a job-private bundle, never change host/cluster trust.
          cat /etc/ssl/certs/ca-certificates.crt "$ca_dir/cluster-ca.crt" >"$ca_dir/ca-bundle.crt"
          rm "$ca_dir/input.pem"
          {
          	echo "NEXORA_CI_CA_FILE=$ca_dir/cluster-ca.crt"
          	echo "NODE_EXTRA_CA_CERTS=$ca_dir/cluster-ca.crt"
          	echo "CARGO_HTTP_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "SSL_CERT_FILE=$ca_dir/ca-bundle.crt"
          	echo "GIT_SSL_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "CURL_CA_BUNDLE=$ca_dir/ca-bundle.crt"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The checkout is owned by the runner user, not the container's root; without this git (and
      # go build's VCS stamping) refuses the repository as dubious ownership.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p nexora-engine --all-targets -- -D warnings
      - run: cargo test --locked -p nexora-engine --all-targets
      - name: Filter index budget (release)
        run: cargo test --locked --release -p nexora-engine --test filter_index_budget
      # The fuzz crate is outside the workspace; check it compiles against the current engine API.
      - run: cargo +nightly check --locked --manifest-path engine/fuzz/Cargo.toml --bins

