        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cache/go-build
            /tmp/cache/gomod
          key: go-toolbox-2-operator-${{ hashFiles('go.sum', 'operator/go.sum') }}
          restore-keys: go-toolbox-2-operator-
      - name: gofmt
        run: test -z "$(gofmt -l operator | tee /dev/stderr)"
      - run: cd operator && go vet ./...
      - run: make operator-test
      - name: Generated operator files are up to date
        run: make operator-generate && git diff --exit-code -- operator deploy/operator deploy/helm/nexora-operator
      # Only trusted main pushes write the cache; PRs restore from it.
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/cache/go-build
            /tmp/cache/gomod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  web:
    runs-on: arc-azrtydxb
    container:
      image: "ant.azrty.com/ci-images/nexora-dev:toolbox-2"
      # Fixtures drop PostgreSQL to dev; prerequisite package installation needs root.
      options: --user 0
    timeout-minutes: 30
    steps:
      - name: Install provisioned CI CA
        env:
          NEXORA_CI_CA_PEM: ${{ secrets.NEXORA_CI_CA_PEM }}
        run: |
          set +x
          set -euo pipefail
          fail_ca() {
          	echo 'Trusted CI CA missing, invalid, or unavailable; parent provisioning required.' >&2
          	exit 1
          }
          [[ -n ${NEXORA_CI_CA_PEM:-} ]] || fail_ca
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          umask 077
          ca_dir=$(mktemp -d "$RUNNER_TEMP/nexora-ca.XXXXXX")
          trap 'rm -rf "$ca_dir"' EXIT
