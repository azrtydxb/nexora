name: fuzz
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["engine/src/wire.rs", "engine/src/edns.rs", "engine/fuzz/**"]
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TARGET_DIR: /tmp/target
jobs:
  parse_query:
    # The dev toolbox image carries the nightly toolchain, cargo-fuzz and protoc (deploy/dev/Dockerfile).
    runs-on: arc-azrtydxb
    container: { image: "192.168.10.131/azrtydxb/nexora-dev:toolbox-1" }
    timeout-minutes: 80
    steps:
      - name: Trust the cluster CA
        run: |
          curl -sk -o /tmp/cluster-ca.crt https://192.168.10.131:8443/repository/public/cluster-ca.crt
          cp /tmp/cluster-ca.crt /usr/local/share/ca-certificates/cluster-ca.crt && update-ca-certificates
          {
            echo "NODE_EXTRA_CA_CERTS=/tmp/cluster-ca.crt"
            echo "CARGO_HTTP_CAINFO=/etc/ssl/certs/ca-certificates.crt"
            echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt"
            echo "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fuzz parse_query for one hour
        working-directory: engine/fuzz
        run: cargo +nightly fuzz run parse_query corpus/parse_query -- -max_total_time=3600 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: engine/fuzz/artifacts/
