on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}
defaults:
  run:
    shell: bash
permissions:
  contents: read
  # GitHub OIDC for the Kuvryn Ant docker login (azrtydxb/ant-setup-action).
  id-token: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
env:
  # Push to the authoritative Kuvryn Ant (OKE); kw replicates oci-hosted and pulls
  # ant.kw.watteel.lab/oci-hosted/azrtydxb/<image>.
  REGISTRY: ant.azrty.com/oci-hosted/azrtydxb
jobs:
  # One job per image builds linux/amd64 + linux/arm64 together on a GitHub-hosted runner and pushes
  # the multi-arch tag directly. arm64 is cross-compiled in the Dockerfiles (stages run on
  # $BUILDPLATFORM), never emulated.
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: nexora-engine, file: deploy/docker/engine.Dockerfile }
          - { name: nexora-mgmt, file: deploy/docker/mgmt.Dockerfile }
          - { name: nexora-operator, file: deploy/docker/operator.Dockerfile }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install provisioned CI CA
        env:
          NEXORA_CI_CA_PEM: ${{ secrets.NEXORA_CI_CA_PEM }}
        run: |
          set +x
          set -euo pipefail
          fail_ca() {
          	echo 'Trusted CI CA missing, invalid, or unavailable; parent provisioning required.' >&2
          	exit 1
          }
          [[ -n ${NEXORA_CI_CA_PEM:-} ]] || fail_ca
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          umask 077
          ca_dir=$(mktemp -d "$RUNNER_TEMP/nexora-ca.XXXXXX")
          trap 'rm -rf "$ca_dir"' EXIT
          printf '%s\n' "$NEXORA_CI_CA_PEM" >"$ca_dir/input.pem"
          unset NEXORA_CI_CA_PEM
          # Reject additional objects, keys, trailing garbage and multiple certificates.
          awk '
            /^-----BEGIN CERTIFICATE-----$/ { if (state != 0) exit 1; state=1; next }
            /^-----END CERTIFICATE-----$/ { if (state != 1) exit 1; state=2; next }
            state == 1 { if ($0 !~ /^[A-Za-z0-9+\/=]+$/) exit 1; next }
            /[^[:space:]]/ { exit 1 }
            END { if (state != 2) exit 1 }
          ' "$ca_dir/input.pem" || fail_ca
          openssl x509 -in "$ca_dir/input.pem" -out "$ca_dir/cluster-ca.crt" 2>/dev/null || fail_ca
          openssl x509 -in "$ca_dir/cluster-ca.crt" -noout -ext basicConstraints 2>/dev/null | grep -E '^[[:space:]]*CA:TRUE(, pathlen:[0-9]+)?[[:space:]]*$' >/dev/null || fail_ca
          openssl verify -check_ss_sig -CAfile "$ca_dir/cluster-ca.crt" "$ca_dir/cluster-ca.crt" >/dev/null 2>&1 || fail_ca
          # Keep public roots; install only a job-private bundle, never change host/cluster trust.
          cat /etc/ssl/certs/ca-certificates.crt "$ca_dir/cluster-ca.crt" >"$ca_dir/ca-bundle.crt"
          rm "$ca_dir/input.pem"
          {
          	echo "NEXORA_CI_CA_FILE=$ca_dir/cluster-ca.crt"
          	echo "NODE_EXTRA_CA_CERTS=$ca_dir/cluster-ca.crt"
          	echo "CARGO_HTTP_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "SSL_CERT_FILE=$ca_dir/ca-bundle.crt"
          	echo "GIT_SSL_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "CURL_CA_BUNDLE=$ca_dir/ca-bundle.crt"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - uses: actions/checkout@v7
      - id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; else echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v4
      - id: ant
        uses: azrtydxb/ant-setup-action@v1
        with:
          build-cache: "true"
          cache-name: ${{ matrix.image.name }}
          arch-suffix: multi
          docker-login: "true"
          required: "true"
          go: "false"
          cargo: "false"
          pip: "false"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # Only main and v* tags publish; a manual run on another branch builds (reading
          # the Ant cache) without pushing, since Ant's token there is read-only.
          # No moving :main tag: Kuvryn Ant keeps tags immutable; deploy by sha or digest.
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.meta.outputs.version }}
          cache-from: ${{ steps.ant.outputs.cache-from }}
          cache-to: ${{ steps.ant.outputs.cache-to }}
          # Unresolved supply-chain debt: no build provenance or SBOM is emitted.
          # TLS verification does not supply artifact attestations.
          provenance: false
          sbom: false
      - name: Verify the manifest list has both architectures
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.meta.outputs.version }}
        run: |
          manifest=$(docker buildx imagetools inspect --raw "$REF")
          echo "$manifest"
          grep -q '"arm64"' <<<"$manifest"
          grep -q '"amd64"' <<<"$manifest"
