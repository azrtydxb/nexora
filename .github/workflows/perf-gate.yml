name: perf-gate
on:
  pull_request:
    paths:
      [
        "engine/**",
        "proto/**",
        "Cargo.lock",
        "bench/**",
        ".github/workflows/perf-gate.yml",
      ]
  schedule:
    - cron: "0 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch: {}
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOCACHE: /tmp/cache/go-build
  GOMODCACHE: /tmp/cache/gomod
  GOPROXY: https://192.168.10.131:8443/repository/golang/,direct
jobs:
  relative:
    name: relative regression vs main (PR)
    # A manual run compares the dispatched commit with itself, measuring this runner's noise floor.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Base and head run interleaved on the same pod, so only their ratio matters, not the absolute
    # numbers. The dedicated amd64 scale set (14 CPU) keeps other jobs' load off the measurement;
    # the toolbox image is arm64-only, so the tools are installed as in the absolute job.
    runs-on: arc-azrtydxb-amd64
    container: { image: "rust:1.97-trixie" }
    timeout-minutes: 75
    steps:
      - name: Install provisioned CI CA
        env:
          NEXORA_CI_CA_PEM: ${{ secrets.NEXORA_CI_CA_PEM }}
        run: |
          set +x
          set -euo pipefail
          fail_ca() {
          	echo 'Trusted CI CA missing, invalid, or unavailable; parent provisioning required.' >&2
          	exit 1
          }
          [[ -n ${NEXORA_CI_CA_PEM:-} ]] || fail_ca
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          umask 077
          ca_dir=$(mktemp -d "$RUNNER_TEMP/nexora-ca.XXXXXX")
          trap 'rm -rf "$ca_dir"' EXIT
          printf '%s\n' "$NEXORA_CI_CA_PEM" >"$ca_dir/input.pem"
          unset NEXORA_CI_CA_PEM
          # Reject additional objects, keys, trailing garbage and multiple certificates.
          awk '
            /^-----BEGIN CERTIFICATE-----$/ { if (state != 0) exit 1; state=1; next }
            /^-----END CERTIFICATE-----$/ { if (state != 1) exit 1; state=2; next }
            state == 1 { if ($0 !~ /^[A-Za-z0-9+\/=]+$/) exit 1; next }
            /[^[:space:]]/ { exit 1 }
            END { if (state != 2) exit 1 }
          ' "$ca_dir/input.pem" || fail_ca
          openssl x509 -in "$ca_dir/input.pem" -out "$ca_dir/cluster-ca.crt" 2>/dev/null || fail_ca
          openssl x509 -in "$ca_dir/cluster-ca.crt" -noout -ext basicConstraints 2>/dev/null | grep -E '^[[:space:]]*CA:TRUE(, pathlen:[0-9]+)?[[:space:]]*$' >/dev/null || fail_ca
          openssl verify -check_ss_sig -CAfile "$ca_dir/cluster-ca.crt" "$ca_dir/cluster-ca.crt" >/dev/null 2>&1 || fail_ca
          # Keep public roots; install only a job-private bundle, never change host/cluster trust.
          cat /etc/ssl/certs/ca-certificates.crt "$ca_dir/cluster-ca.crt" >"$ca_dir/ca-bundle.crt"
          rm "$ca_dir/input.pem"
          {
          	echo "NEXORA_CI_CA_FILE=$ca_dir/cluster-ca.crt"
          	echo "NODE_EXTRA_CA_CERTS=$ca_dir/cluster-ca.crt"
          	echo "CARGO_HTTP_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "SSL_CERT_FILE=$ca_dir/ca-bundle.crt"
          	echo "GIT_SSL_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "CURL_CA_BUNDLE=$ca_dir/ca-bundle.crt"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - name: Install Go, protoc and dnsperf
        run: |
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler dnsperf
          curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      # Container root does not own the runner's checkout; trust it so git and go build's VCS
      # stamping work (ephemeral container, so trusting every path is harmless).
      - run: git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: head }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: "${{ github.event.pull_request.base.sha || github.sha }}"
      - name: Build base and head engines, fixture and perfgate
        run: |
          (cd base && CARGO_TARGET_DIR=/tmp/target-base cargo build --locked --release -p nexora-engine)
          (cd head && CARGO_TARGET_DIR=/tmp/target-head cargo build --locked --release -p nexora-engine)
          (cd head && go build -o ../perfgate ./bench/cmd/perfgate && go build -o ../nexora-fixture ./e2e/fixtures/cmd/nexora-fixture)
      # Nine rounds of back-to-back base and head runs, the order alternating each round; the gate
      # takes the median of the per-round head/base ratios, which cancels drift in the pod's speed
      # and ignores rounds hit by bursts of outside load.
      # debt: the 5% limit is the spec's, not yet shown to sit above this runner's base==head noise
      # (on the loaded arm64 dev pod independent 9-round A/A gates read -2.5% to +8.8%, see
      # .procoder/notes/plan-review.md); revisit with workflow_dispatch A/A runs on this runner.
      - name: Interleaved A/B benchmark (9 rounds)
        run: |
          bench() { ./perfgate run --engine "/tmp/target-$1/release/nexora-engine" --fixture ./nexora-fixture --names 10000 --seconds 15 --workers 2 --out "$1-$2.json"; }
          for i in $(seq 1 9); do
            if [ $((i % 2)) -eq 1 ]; then bench base "$i"; bench head "$i"; else bench head "$i"; bench base "$i"; fi
          done
      - name: Fail on more than 5% QPS drop
        run: |
          files() { seq 1 9 | sed "s/.*/$1-&.json/" | paste -sd, -; }
          ./perfgate compare --base "$(files base)" --head "$(files head)" --max-drop 0.05
      # The filter index decision time, interleaved like the QPS rounds, on a synthetic corpus generated
      # in-process (no list download). filter-compare gates the median per-round head/base ratio of the
      # cold blocked and clean decision times, and of the Zipf decision-cache time once both sides
      # report it. The base commit of the PR that introduces filter_bench has no benchmark CLI yet;
      # that one PR passes with a notice.
      # debt: like the QPS gate, the 5% limit is not yet shown to sit above this runner's A/A noise;
      # revisit with workflow_dispatch A/A runs on this runner.
      - name: Interleaved filter benchmark (9 rounds) and 5% decision-time gate
        run: |
          if ! grep -q -- "synthetic" base/engine/examples/filter_bench.rs 2>/dev/null; then
            echo "::notice::base has no filter_bench CLI; the filter gate applies from the next PR"
            exit 0
          fi
          (cd base && CARGO_TARGET_DIR=/tmp/target-base cargo build --locked --release -p nexora-engine --example filter_bench)
          (cd head && CARGO_TARGET_DIR=/tmp/target-head cargo build --locked --release -p nexora-engine --example filter_bench)
          fb() { "/tmp/target-$1/release/examples/filter_bench" --synthetic 2000000 --seed 7 --threads 2 --rounds 5 --json "filter-$1-$2.json" > /dev/null; }
          for i in $(seq 1 9); do
            if [ $((i % 2)) -eq 1 ]; then fb base "$i"; fb head "$i"; else fb head "$i"; fb base "$i"; fi
          done
          files() { seq 1 9 | sed "s/.*/filter-$1-&.json/" | paste -sd, -; }
          ./perfgate filter-compare --base "$(files base)" --head "$(files head)" --max-regress 0.05
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: perf-relative, path: "*.json" }

  absolute:
    name: absolute gate on the reference box (nightly, release tags)
    # Skipped until the reference box (8-core x86_64, 10GbE) is provisioned and its variables set.
    if: github.event_name != 'pull_request' && vars.NEXORA_REFERENCE_HOST != ''
    # debt: the load is generated from an amd64 ARC pod rather than a dedicated load host, so a
    # failing run may be the pod's ceiling; revisit when a dedicated load host joins the org.
    runs-on: arc-azrtydxb-amd64
    container: { image: "rust:1.97-trixie" }
    timeout-minutes: 90
    env:
      REF_HOST: ${{ vars.NEXORA_REFERENCE_HOST }}
      REF_ADDR: ${{ vars.NEXORA_REFERENCE_DNS_ADDR }}
    steps:
      - name: Install provisioned CI CA
        env:
          NEXORA_CI_CA_PEM: ${{ secrets.NEXORA_CI_CA_PEM }}
        run: |
          set +x
          set -euo pipefail
          fail_ca() {
          	echo 'Trusted CI CA missing, invalid, or unavailable; parent provisioning required.' >&2
          	exit 1
          }
          [[ -n ${NEXORA_CI_CA_PEM:-} ]] || fail_ca
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          umask 077
          ca_dir=$(mktemp -d "$RUNNER_TEMP/nexora-ca.XXXXXX")
          trap 'rm -rf "$ca_dir"' EXIT
          printf '%s\n' "$NEXORA_CI_CA_PEM" >"$ca_dir/input.pem"
          unset NEXORA_CI_CA_PEM
          # Reject additional objects, keys, trailing garbage and multiple certificates.
          awk '
            /^-----BEGIN CERTIFICATE-----$/ { if (state != 0) exit 1; state=1; next }
            /^-----END CERTIFICATE-----$/ { if (state != 1) exit 1; state=2; next }
            state == 1 { if ($0 !~ /^[A-Za-z0-9+\/=]+$/) exit 1; next }
            /[^[:space:]]/ { exit 1 }
            END { if (state != 2) exit 1 }
          ' "$ca_dir/input.pem" || fail_ca
          openssl x509 -in "$ca_dir/input.pem" -out "$ca_dir/cluster-ca.crt" 2>/dev/null || fail_ca
          openssl x509 -in "$ca_dir/cluster-ca.crt" -noout -ext basicConstraints 2>/dev/null | grep -E '^[[:space:]]*CA:TRUE(, pathlen:[0-9]+)?[[:space:]]*$' >/dev/null || fail_ca
          openssl verify -check_ss_sig -CAfile "$ca_dir/cluster-ca.crt" "$ca_dir/cluster-ca.crt" >/dev/null 2>&1 || fail_ca
          # Keep public roots; install only a job-private bundle, never change host/cluster trust.
          cat /etc/ssl/certs/ca-certificates.crt "$ca_dir/cluster-ca.crt" >"$ca_dir/ca-bundle.crt"
          rm "$ca_dir/input.pem"
          {
          	echo "NEXORA_CI_CA_FILE=$ca_dir/cluster-ca.crt"
          	echo "NODE_EXTRA_CA_CERTS=$ca_dir/cluster-ca.crt"
          	echo "CARGO_HTTP_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "SSL_CERT_FILE=$ca_dir/ca-bundle.crt"
          	echo "GIT_SSL_CAINFO=$ca_dir/ca-bundle.crt"
          	echo "CURL_CA_BUNDLE=$ca_dir/ca-bundle.crt"
          } >>"$GITHUB_ENV"
          trap - EXIT
      - name: Install Go, protoc and dnsperf
        run: |
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends protobuf-compiler dnsperf openssh-client
          curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      # Container root does not own the runner's checkout; trust it so git and go build's VCS
      # stamping work (ephemeral container, so trusting every path is harmless).
      - run: git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release binaries
        run: |
          cargo build --locked --release -p nexora-engine
          go build -o perfgate ./bench/cmd/perfgate
          go build -o nexora-fixture ./e2e/fixtures/cmd/nexora-fixture
      - name: Start the engine on the reference box
        env:
          SSH_KEY: ${{ secrets.NEXORA_REFERENCE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && install -m 600 /dev/null ~/.ssh/nexora-ref && printf '%s\n' "$SSH_KEY" > ~/.ssh/nexora-ref
          scp -i ~/.ssh/nexora-ref target/release/nexora-engine perfgate nexora-fixture "$REF_HOST:/tmp/"
          # shellcheck disable=SC2029 # REF_ADDR is meant to expand on this side.
          ssh -i ~/.ssh/nexora-ref "$REF_HOST" "nohup /tmp/perfgate serve --engine /tmp/nexora-engine --fixture /tmp/nexora-fixture --listen $REF_ADDR --workers 8 > /tmp/perfgate.log 2>&1 & echo \$! > /tmp/perfgate.pid"
          for _ in $(seq 1 60); do ssh -i ~/.ssh/nexora-ref "$REF_HOST" grep -q 'perfgate ready' /tmp/perfgate.log && break; sleep 1; done
      - name: Load from this host
        run: ./perfgate load --target "$REF_ADDR" --names 100000 --seconds 60 --clients 64 --threads 16 --out absolute.json
      - name: Enforce >= 1,000,000 QPS and p99 < 500us
        run: ./perfgate absolute --result absolute.json --min-qps 1000000 --max-p99 500us
      - name: Stop the engine
        if: always()
        run: ssh -i ~/.ssh/nexora-ref "$REF_HOST" 'kill $(cat /tmp/perfgate.pid)' || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: perf-absolute, path: absolute.json }
