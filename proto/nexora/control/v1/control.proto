syntax = "proto3";

package nexora.control.v1;

option go_package = "github.com/piwi3910/nexora/gen/go/nexora/control/v1;controlv1";

// EngineControl is served by every management plane instance on NEXORA_GRPC_LISTEN.
// Enroll uses server-auth TLS (engine pins the CA fingerprint from the join token);
// Connect and GetBlob require the engine's client certificate (CN = engine UUID).
service EngineControl {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream EngineMessage) returns (stream ServerMessage);
  rpc GetBlob(GetBlobRequest) returns (stream BlobChunk);
}

message EnrollRequest {
  string join_secret = 1;     // base32 secret part of nxj1.<secret>.<ca sha256>
  string node_name = 2;       // [a-z0-9-]{1,63}
  bytes csr_der = 3;          // PKCS#10, ECDSA P-256
  string engine_version = 4;
}

message EnrollResponse {
  string engine_id = 1;       // UUID, also the certificate CN
  bytes certificate_der = 2;
  bytes ca_certificate_der = 3;
}

message EngineMessage {
  oneof msg {
    Hello hello = 1;
    Applied applied = 2;
    Rejected rejected = 3;
    Stats stats = 4;
    TlsMaterialResult tls_material_result = 300; // M2
    NotifyReceived notify_received = 200;        // M4
    UpdateRequest update_request = 201;          // M4
    CertificateRequest cert_request = 500;       // M5
  }
}

message Hello {
  string engine_id = 1;
  string node_name = 2;
  uint64 applied_version = 3; // 0 when nothing applied
  string engine_version = 4;
  string tls_fingerprint_sha256 = 300; // M2: empty when the engine holds no DNS serving certificate
}

message Applied {
  uint64 version = 1;
  string persist_error = 2;   // non-empty when snapshot.binpb could not be written
}

message Rejected {
  uint64 version = 1;
  string reason = 2;
}

message ServerMessage {
  oneof msg {
    ConfigSnapshot snapshot = 1;
    VersionAhead version_ahead = 2;
    RpzTsigKeys rpz_tsig_keys = 100;   // M3: never persisted, never part of ConfigSnapshot
    TlsMaterial tls_material = 300;    // M2: never persisted, never part of ConfigSnapshot
    KeyMaterial key_material = 200;    // M4: never persisted, never part of ConfigSnapshot
    UpdateResult update_result = 201;  // M4: reply to EngineMessage.update_request
    CertificateIssued cert_issued = 500;       // M5: reply to EngineMessage.cert_request
    RenewCertificate renew_certificate = 501; // M5: send a CertificateRequest now
  }
}

// Sent when the engine reports a version newer than the database (restored backup).
message VersionAhead {
  uint64 server_version = 1;
}

message ConfigSnapshot {
  uint64 version = 1;
  int64 created_unix_ms = 2;
  ResolverConfig resolver = 3;
  CacheConfig cache = 4;
  repeated Upstream upstreams = 5;
  repeated string acl_allow_cidrs = 6;
  FilterConfig filter = 7;
  TelemetryConfig telemetry = 8;
  // M2: per-client policy. FilterConfig stays the global filter selection.
  repeated PolicyGroup policy_groups = 300;
  repeated RewriteSet rewrite_sets = 301;
  repeated string global_rewrite_set_ids = 302; // rewrite sets for clients in no group, in precedence order
  // M3: recursion, DNSSEC validation, RPZ.
  ResolutionMode resolution_mode = 100;
  RecursionConfig recursion = 101;
  repeated ForwardZone forward_zones = 102;
  DnssecConfig dnssec = 103;
  repeated RpzZone rpz_zones = 104; // ordered: index 0 has the highest precedence
  // Validate answers from the global upstreams (forward mode) up to the root trust anchor, fetching
  // DS/DNSKEY through the forwarder. Requires dnssec.validation. Management defaults it to true.
  bool dnssec_validate_forwarded = 105;
  // M4: hosted zones.
  repeated AuthZone auth_zones = 200;
  // Filter categories.
  uint64 filter_index_max_bytes = 600; // 0 = engine default (50% of the cgroup memory limit, else 512 MiB)
}

enum UpstreamStrategy {
  UPSTREAM_STRATEGY_UNSPECIFIED = 0;
  UPSTREAM_STRATEGY_ORDERED = 1;
  UPSTREAM_STRATEGY_FASTEST = 2;
}

message ResolverConfig {
  UpstreamStrategy strategy = 1;
}

message CacheConfig {
  uint64 max_bytes = 1;         // >= 1048576
  uint32 min_ttl = 2;
  uint32 max_ttl = 3;
  uint32 negative_max_ttl = 4;
  uint32 stale_window = 5;
}

enum UpstreamProtocol {
  UPSTREAM_PROTOCOL_UNSPECIFIED = 0;
  UPSTREAM_PROTOCOL_UDP = 1;
  UPSTREAM_PROTOCOL_TCP = 2;
  UPSTREAM_PROTOCOL_DOT = 3;
  UPSTREAM_PROTOCOL_DOH = 4;
}

message Upstream {
  string id = 1;
  string name = 2;
  UpstreamProtocol protocol = 3;
  string address = 4;           // ip:port for UDP/TCP/DoT; empty for DoH
  string tls_server_name = 5;   // DoT SNI and certificate name
  string doh_url = 6;           // https URL for DoH
  uint32 timeout_ms = 7;        // 50..=5000
  string ca_certificate_pem = 8; // extra trust anchor for DoT/DoH; empty = webpki roots
}

enum BlockMode {
  BLOCK_MODE_UNSPECIFIED = 0;
  BLOCK_MODE_NULL_IP = 1;
  BLOCK_MODE_NXDOMAIN = 2;
  BLOCK_MODE_REFUSED = 3;
}

message BlobRef {
  string sha256 = 1;            // 64 lowercase hex of the zstd bytes
  uint64 size = 2;              // compressed size in bytes
  string name = 3;
}

message FilterConfig {
  repeated BlobRef blocklists = 1;
  repeated BlobRef allowlists = 2;
  BlockMode block_mode = 3;
  uint32 block_ttl = 4;
  // Filter categories.
  repeated FilterListRef blocklist_refs = 600; // blocklists with identity; engines prefer these over blocklists
  repeated FilterListRef allowlist_refs = 601;
}

message TelemetryConfig {
  string otlp_endpoint = 1;          // gRPC OTLP endpoint for traces/metrics (and logs unless querylog_to_management)
  uint32 trace_sample_one_in = 2;    // 0 = head sampling off
  uint32 trace_slow_threshold_us = 3;
  bool querylog_to_management = 4;   // send OTLP logs to the connected management instance (builtin backend)
}

message GetBlobRequest {
  string sha256 = 1;
}

message BlobChunk {
  bytes data = 1;                    // <= 1 MiB
}

message UpstreamStatus {
  string id = 1;
  string name = 2;
  bool up = 3;
  uint32 rtt_us = 4;
  uint64 queries_total = 5;
  uint64 failures_total = 6;
}

message Stats {
  int64 unix_ms = 1;
  uint64 queries_total = 2;
  uint64 cache_hits_total = 3;
  uint64 cache_misses_total = 4;
  uint64 cache_stale_served_total = 5;
  uint64 filter_blocked_total = 6;
  uint64 servfail_total = 7;
  repeated uint64 duration_bucket_bounds_us = 8;
  repeated uint64 duration_bucket_counts = 9;   // cumulative, same length as bounds
  uint64 duration_sum_us = 10;
  repeated UpstreamStatus upstreams = 11;
  map<string, uint64> export_dropped_total = 12; // keyed by signal: logs, traces, metrics
  uint64 cache_entries = 13;
  uint64 cache_bytes = 14;
  // M3
  RecursionStats recursion = 100;
  DnssecStats dnssec = 101;
  repeated RpzZoneStatus rpz_zones = 102;
  // Filter categories.
  FilterIndexStats filter_index = 600;
}

// ---------------------------------------------------------------------------
// M2: client transports + policy. Fields added to M1 messages use numbers 300-399.
// ---------------------------------------------------------------------------

// A client group selected by source CIDR. Most specific CIDR across all groups wins;
// a client in a group gets only the group's blocklists, allowlist and rewrite sets
// (the global FilterConfig and global rewrite sets do not apply to it).
message PolicyGroup {
  string id = 1;                        // policy_groups.id (UUID)
  string name = 2;
  repeated string cidrs = 3;            // canonical prefixes, host bits zero, e.g. "10.1.0.0/16"
  repeated BlobRef blocklists = 4;      // normalised list blobs (same format as FilterConfig.blocklists), fetched via GetBlob
  repeated string allowlist = 5;        // lowercase punycode domains, no trailing dot; matches subdomains
  repeated string rewrite_set_ids = 6;  // RewriteSet.id values, in precedence order
  // Filter categories.
  repeated FilterListRef blocklist_refs = 600;
}

enum RewriteType {
  REWRITE_TYPE_UNSPECIFIED = 0;
  REWRITE_TYPE_A = 1;
  REWRITE_TYPE_AAAA = 2;
  REWRITE_TYPE_CNAME = 3;
}

message RewriteRule {
  string name = 1;       // lowercase punycode, no trailing dot; "*." prefix = strict subdomains of the rest
  RewriteType type = 2;
  string value = 3;      // IPv4 text, IPv6 text, or CNAME target domain (no trailing dot)
  uint32 ttl = 4;        // 0..=86400
}

// Ids: "custom:global", "custom:group:<uuid>", "safesearch:google", "safesearch:bing",
// "safesearch:duckduckgo", "safesearch:youtube-strict", "safesearch:youtube-moderate".
message RewriteSet {
  string id = 1;
  string label = 2;
  repeated RewriteRule rules = 3;
}

// DNS serving certificate for DoT/DoH/DoQ. Sent only on the Connect stream; held in
// engine memory only; never part of ConfigSnapshot.
message TlsMaterial {
  bytes certificate_chain_pem = 1;  // leaf first
  bytes private_key_pem = 2;        // PKCS#8, SEC1 or PKCS#1 PEM
  string fingerprint_sha256 = 3;    // lowercase hex SHA-256 of the leaf DER
}

message TlsMaterialResult {
  string fingerprint_sha256 = 1;    // echoes TlsMaterial.fingerprint_sha256
  bool applied = 2;
  string error = 3;                 // empty when applied
}

// ---------------------------------------------------------------------------
// M3: recursion, DNSSEC validation, RPZ. Fields added to earlier messages use numbers 100-199.
// ---------------------------------------------------------------------------

enum ResolutionMode {
  RESOLUTION_MODE_UNSPECIFIED = 0; // engine treats as FORWARD
  RESOLUTION_MODE_FORWARD = 1;
  RESOLUTION_MODE_RECURSIVE = 2;
}

message RootHint {
  string name = 1;               // e.g. "a.root-servers.net."
  repeated string addresses = 2; // IPv4 or IPv6 literals, no port
}

message RecursionConfig {
  repeated RootHint root_hints = 1; // empty: compiled-in IANA hints
  bool qname_minimisation = 2;      // RFC 9156
  bool aggressive_nsec = 3;         // RFC 8198, off by default
  uint32 max_upstream_queries = 4;  // 0 -> 100; valid 1..=1000
  uint32 max_delegation_depth = 5;  // 0 -> 32; valid 1..=64
  uint32 authority_port = 6;        // 0 -> 53; port used for every authoritative server
}

message ForwardZone {
  string domain = 1;             // "corp.example."
  repeated string addresses = 2; // "ip:port", UDP with TCP fallback on TC
  bool validate = 3;             // false: answers under this zone are treated as insecure
}

message TrustAnchor {
  string zone = 1; // "."
  string ds = 2;   // "20326 8 2 E06D44B8..."
}

message NegativeTrustAnchor {
  string domain = 1;
  int64 expires_unix = 2;
}

message DnssecConfig {
  bool validation = 1;
  repeated TrustAnchor trust_anchors = 2;
  repeated NegativeTrustAnchor negative_trust_anchors = 3;
  bool rfc5011 = 4;
}

enum RpzPolicyOverride {
  RPZ_POLICY_OVERRIDE_GIVEN = 0;
  RPZ_POLICY_OVERRIDE_DISABLED = 1; // match counted, no action
  RPZ_POLICY_OVERRIDE_NXDOMAIN = 2;
  RPZ_POLICY_OVERRIDE_NODATA = 3;
  RPZ_POLICY_OVERRIDE_PASSTHRU = 4;
  RPZ_POLICY_OVERRIDE_DROP = 5;
  RPZ_POLICY_OVERRIDE_TCP_ONLY = 6;
}

enum TsigAlgorithm {
  TSIG_ALGORITHM_NONE = 0;
  TSIG_ALGORITHM_HMAC_SHA256 = 1;
  TSIG_ALGORITHM_HMAC_SHA512 = 2;
  TSIG_ALGORITHM_HMAC_SHA384 = 3; // M4: hosted-zone TSIG only; RPZ transfers accept SHA-256/512
}

message RpzFileSource {
  BlobRef blob = 1; // zstd-compressed zone text, fetched via GetBlob like filter lists
}

message RpzTransferSource {
  string primary = 1; // "ip:port"
  string tsig_key_name = 2;
  TsigAlgorithm tsig_algorithm = 3; // the secret arrives only in RpzTsigKeys
  uint32 min_refresh_seconds = 4;   // 0 -> 60
}

message RpzZone {
  string id = 1;   // UUID
  string name = 2; // zone origin, "rpz.example."
  oneof source {
    RpzFileSource file = 3;
    RpzTransferSource transfer = 4;
  }
  RpzPolicyOverride policy_override = 5;
  uint64 refresh_nonce = 6; // incremented by POST /rpz-zones/{id}/refresh
}

// TSIG secrets of RPZ transfer zones. Sent only on the Connect stream; held in engine memory only;
// never part of ConfigSnapshot, never persisted by the engine.
message RpzTsigKey {
  string zone_id = 1; // RpzZone.id
  string key_name = 2;
  TsigAlgorithm algorithm = 3;
  bytes secret = 4;
}

message RpzTsigKeys {
  repeated RpzTsigKey keys = 1; // the complete set; an absent zone has no key
}

message RecursionStats {
  uint64 upstream_queries = 1;
  uint64 mismatched_replies = 2;
  uint64 tcp_fallbacks = 3;
  uint64 work_limit_exceeded = 4;
  uint32 infra_entries = 5;
  uint64 lame_marked = 6;
}

enum TrustAnchorState {
  TRUST_ANCHOR_STATE_UNSPECIFIED = 0;
  TRUST_ANCHOR_STATE_CONFIGURED = 1;
  TRUST_ANCHOR_STATE_ADD_PEND = 2;
  TRUST_ANCHOR_STATE_VALID = 3;
  TRUST_ANCHOR_STATE_MISSING = 4;
  TRUST_ANCHOR_STATE_REVOKED = 5;
}

message TrustAnchorStatus {
  string zone = 1;
  uint32 key_tag = 2;
  uint32 algorithm = 3;
  TrustAnchorState state = 4;
  int64 last_refresh_success_unix = 5;
  int64 hold_down_until_unix = 6;
  string last_error = 7;
}

message DnssecStats {
  uint64 secure = 1;
  uint64 insecure = 2;
  uint64 bogus = 3;
  uint64 indeterminate = 4;
  repeated TrustAnchorStatus trust_anchors = 5;
  uint32 active_negative_trust_anchors = 6;
}

message RpzZoneStatus {
  string id = 1;
  uint32 serial = 2;
  uint64 records = 3;
  uint64 skipped = 4;
  uint64 hits = 5;
  int64 last_success_unix = 6;
  string last_error = 7;
  bool stale = 8;
}

// ---- M4 (authoritative). Field numbers 200-299 in ConfigSnapshot and in both
// Connect stream envelopes are reserved for M4.

enum AuthZoneKind {
  AUTH_ZONE_KIND_UNSPECIFIED = 0;
  AUTH_ZONE_KIND_PRIMARY = 1;
  AUTH_ZONE_KIND_SECONDARY = 2;
}

// Image and delta blobs are M1 BlobRefs: sha256 = lowercase hex of the zstd-compressed NZF1 bytes,
// size = compressed octets, name = "<zone>@<serial>" (informational). Fetched with GetBlob.
message ZoneDelta {
  uint32 from_serial = 1;
  uint32 to_serial = 2;
  BlobRef blob = 3;
}

message TransferPolicy {
  repeated string allow_cidrs = 1; // empty = transfers refused
  string tsig_key = 2;             // absolute lowercase key name; empty = no TSIG required
}

message NotifyTarget {
  string address = 1; // "ip:port"
  string tsig_key = 2;
}

message AuthZone {
  string name = 1;               // absolute, lowercase, trailing dot
  AuthZoneKind kind = 2;
  uint32 serial = 3;
  BlobRef image = 4;             // full image at image_serial
  uint32 image_serial = 5;
  repeated ZoneDelta deltas = 6; // contiguous chain; last to_serial == serial
  uint32 image_delta_offset = 7; // deltas[image_delta_offset..] apply on top of image
  TransferPolicy transfer = 8;
  repeated NotifyTarget notify = 9;
  repeated string primaries = 10;        // secondary: "ip:port" accepted as NOTIFY sources
  repeated string update_tsig_keys = 11; // key names allowed to UPDATE; empty = updates refused
  bool expired = 12;                     // secondary past SOA expire: SERVFAIL
  // Parallel to primaries (empty, or one entry per primary): the TSIG key name a NOTIFY from that
  // primary must be signed with; "" accepts unsigned NOTIFY (or any valid key) from its address.
  repeated string primary_tsig_keys = 200;
}

message TsigSecret {
  string name = 1;             // absolute, lowercase
  TsigAlgorithm algorithm = 2; // HMAC_SHA256 | HMAC_SHA384 | HMAC_SHA512
  bytes secret = 3;
}

// The complete TSIG key set, like RpzTsigKeys: sent on Connect before the snapshot and whenever the
// set changes. Only on the Connect stream; held in engine memory; never part of ConfigSnapshot,
// config_versions or state_dir.
message KeyMaterial {
  repeated TsigSecret tsig_keys = 1;
}

message NotifyReceived {
  string zone = 1;
  string source = 2; // "ip:port"
  uint32 serial = 3;
  bool has_serial = 4;
}

message UpdateRequest {
  string request_id = 1;
  string zone = 2;
  string client = 3;   // "ip:port"
  bytes message = 4;   // complete UPDATE wire message including its TSIG RR
  string tsig_key = 5; // key that verified on the engine
}

message UpdateResult {
  string request_id = 1;
  uint32 rcode = 2;
  string detail = 3;
}

// ---- M5: engine certificate renewal and rotation ----

// Engine -> server: a PKCS#10 CSR for a new ECDSA P-256 key; the subject CN must be the engine id.
message CertificateRequest {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_RENEWAL = 1; // 2/3 of the certificate lifetime passed
    REASON_ROTATE = 2;  // answering RenewCertificate
  }
  bytes csr_der = 1;
  Reason reason = 2;
}

// Server -> engine: the issued client certificate and the CA that signed it (both DER).
message CertificateIssued {
  bytes cert_der = 1;
  bytes ca_der = 2;
}

// Server -> engine: an operator requested rotation; send a CertificateRequest.
message RenewCertificate {
  CertificateRequest.Reason reason = 1;
}

// ---------------------------------------------------------------------------
// Filter categories: fields added to existing messages use 600-699.
// ---------------------------------------------------------------------------

// A filter list blob with its identity. Management also fills the M1 BlobRef fields with the same
// blobs so engines without this message keep filtering.
message FilterListRef {
  string list_id = 1;   // filter_lists.id; "allowlist" for the global allowlist blob
  string category = 2;  // catalog category key ([a-z0-9-]{1,32}); empty for custom lists
  uint32 position = 3;  // attribution order: catalog position from 1, custom lists from 1000000 by name
  BlobRef blob = 4;
}

message FilterIndexStats {
  uint64 entries = 1;
  uint64 bytes = 2;                 // index plus views
  uint64 max_bytes = 3;             // cap in force
  double build_seconds = 4;         // last build (0 when the index was reused from the first build)
  double decision_ns_blocked = 5;   // median per decision, measured after the last build
  double decision_ns_clean = 6;
  string cpu = 7;                   // core of that measurement: cortex-a76, cortex-a55, x86_64, ...
  map<string, uint64> blocked_by_category = 8; // "custom" for lists without a category
}
