  /zones/{zoneId}/records/{recordId}:
    parameters:
      - { name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateZoneRecord
      tags: [zones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordUpdate" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteZoneRecord
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/Revision"
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /zones/{zoneId}/import:
    parameters:
      - { name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: importZoneFile
      tags: [zones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneImport" }
      responses:
        "200":
          description: Every record and the SOA fields replaced by the file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZoneImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /zones/{zoneId}/export:
    parameters:
      - { name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportZoneFile
      tags: [zones]
      responses:
        "200":
          description: The zone as a BIND master file.
          headers:
            Content-Disposition: { schema: { type: string }, required: true }
          content:
            text/plain; charset=utf-8:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /tsig-keys:
    get:
      operationId: listTsigKeys
      tags: [zones]
      responses:
        "200":
          description: TSIG keys ordered by name, without secrets.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TsigKey" } }
    post:
      operationId: createTsigKey
      tags: [zones]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TsigKeyCreate" }
      responses:
        "201":
          description: Created; the only response that carries the secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TsigKeyCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /tsig-keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: deleteTsigKey
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/Revision"
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
