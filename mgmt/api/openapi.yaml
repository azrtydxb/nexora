openapi: 3.1.0
info: { title: Nexora management API, version: 1.0.0 }
servers: [{ url: /api/v1 }]
security: [{ session: [] }, { bearer: [] }]
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: nexora_session }
    bearer: { type: http, scheme: bearer }
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    Revision:
      {
        name: revision,
        in: query,
        required: true,
        schema: { type: integer, format: int64 },
      }
  responses:
    Error:
      {
        description: error,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          description: Per-line problems of submitted zone data.
          items:
            type: object
            required: [line, message]
            properties:
              line: { type: integer }
              message: { type: string }
    Health:
      type: object
      required: [status, database, version]
      properties:
        {
          status: { type: string, enum: [ok, degraded] },
          database: { type: string, enum: [ok, unavailable] },
          version: { type: string },
        }
    SetupStatus:
      {
        type: object,
        required: [required],
        properties: { required: { type: boolean } },
      }
    SetupRequest:
      type: object
      required: [token, username, email, password]
      properties:
        {
          token: { type: string },
          username: { type: string },
          email: { type: string },
          password: { type: string, minLength: 12 },
        }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string } }
    AuthProviders:
      {
        type: object,
        required: [local, oidc],
        properties: { local: { type: boolean }, oidc: { type: boolean } },
      }
    Role: { type: string, enum: [viewer, operator, admin] }
    User:
      type: object
      required:
        [id, username, email, role, source, disabled, revision, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        source: { type: string, enum: [local, oidc] }
        disabled: { type: boolean }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [username, email, password, role]
      properties:
        {
          username: { type: string },
          email: { type: string },
          password: { type: string, minLength: 12 },
          role: { $ref: "#/components/schemas/Role" },
        }
    UserUpdate:
      type: object
      required: [revision, email, role, disabled]
      properties:
        {
          revision: { type: integer, format: int64 },
          email: { type: string },
          role: { $ref: "#/components/schemas/Role" },
          disabled: { type: boolean },
          password: { type: string, minLength: 12 },
        }
    Upstream:
      type: object
      required:
        [
          id,
          name,
          protocol,
          address,
          tls_server_name,
          doh_url,
          timeout_ms,
          ca_certificate_pem,
          position,
          enabled,
          revision,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        protocol: { type: string, enum: [udp, tcp, dot, doh] }
        address: { type: string }
        tls_server_name: { type: string }
        doh_url: { type: string }
        timeout_ms: { type: integer, minimum: 50, maximum: 5000 }
        ca_certificate_pem: { type: string }
        position: { type: integer }
        enabled: { type: boolean }
        revision: { type: integer, format: int64 }
    UpstreamInput:
      type: object
      required: [name, protocol, timeout_ms, enabled, position]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name: { type: string, minLength: 1, maxLength: 64 }
        protocol: { type: string, enum: [udp, tcp, dot, doh] }
        address: { type: string }
        tls_server_name: { type: string }
        doh_url: { type: string }
        timeout_ms: { type: integer, minimum: 50, maximum: 5000 }
        ca_certificate_pem: { type: string }
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        revision:
          { type: integer, format: int64, description: required on update }
    ResolverSettings:
      type: object
      required:
        [
          strategy,
          cache_max_bytes,
          cache_min_ttl,
          cache_max_ttl,
          cache_negative_max_ttl,
          cache_stale_window,
          block_mode,
          block_ttl,
          otlp_endpoint,
          trace_sample_one_in,
          trace_slow_threshold_us,
          revision,
        ]
      properties:
        strategy: { type: string, enum: [ordered, fastest] }
        cache_max_bytes: { type: integer, format: int64, minimum: 1048576 }
        cache_min_ttl: { type: integer, minimum: 0 }
        cache_max_ttl: { type: integer, minimum: 0 }
        cache_negative_max_ttl: { type: integer, minimum: 0 }
        cache_stale_window: { type: integer, minimum: 0 }
        block_mode: { type: string, enum: [null_ip, nxdomain, refused] }
        block_ttl: { type: integer, minimum: 0 }
        otlp_endpoint: { type: string }
        trace_sample_one_in: { type: integer, minimum: 0 }
        trace_slow_threshold_us: { type: integer, minimum: 0 }
        revision: { type: integer, format: int64 }
    AccessControl:
      type: object
      required: [allow_cidrs, revision]
      properties:
        {
          allow_cidrs: { type: array, items: { type: string } },
          revision: { type: integer, format: int64 },
        }
    FilterList:
      type: object
      required:
        [
          id,
          name,
          kind,
          url,
          refresh_interval_seconds,
          enabled,
          entry_count,
          invalid_line_count,
          last_error,
          stale,
          revision,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [block, allow] }
        url: { type: string }
        refresh_interval_seconds: { type: integer, minimum: 300 }
        enabled: { type: boolean }
        current_blob_sha256: { type: [string, "null"] }
        entry_count: { type: integer }
        invalid_line_count: { type: integer }
        last_success_at: { type: [string, "null"], format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        stale:
          {
            type: boolean,
            description: last attempt failed or last success older than 2 x refresh interval,
          }
        revision: { type: integer, format: int64 }
    FilterListInput:
      type: object
      required: [name, kind, url, refresh_interval_seconds, enabled]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [block, allow] }
        url: { type: string, pattern: "^https?://" }
        refresh_interval_seconds: { type: integer, minimum: 300 }
        enabled: { type: boolean }
        revision: { type: integer, format: int64 }
    Allowlist:
      type: object
      required: [domains, revision]
      properties:
        {
          domains: { type: array, items: { type: string } },
          revision: { type: integer, format: int64 },
        }
    Engine:
      type: object
      required:
        [
          id,
          node_name,
          engine_version,
          enrolled_at,
          connected,
          applied_version,
          rejected_reason,
          persist_error,
          version_ahead,
          status,
          engine_group_id,
          engine_group_name,
          labels,
          revision,
          target_version,
          certificate_serial,
        ]
      properties:
        id: { type: string, format: uuid }
        node_name: { type: string }
        engine_version: { type: string }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        connected: { type: boolean }
        applied_version: { type: integer, format: int64 }
        rejected_version: { type: [integer, "null"], format: int64 }
        rejected_reason: { type: string }
        persist_error: { type: string }
        version_ahead: { type: boolean }
        status:
          {
            type: string,
            enum: [current, behind, rejected, ahead, disconnected, revoked],
          }
        engine_group_id: { type: string, format: uuid }
        engine_group_name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        revision: { type: integer, format: int64 }
        target_version: { type: integer, format: int64 }
        certificate_serial: { type: string }
        revoked_at: { type: [string, "null"], format: date-time }
        cert_rotate_requested_at: { type: [string, "null"], format: date-time }
        certificate_not_after: { type: [string, "null"], format: date-time }
    JoinToken:
      type: object
      required:
        [
          id,
          name,
          created_by,
          created_at,
          expires_at,
          uses,
          engine_group_id,
          engine_group_name,
          labels,
          state,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        uses: { type: integer }
        engine_group_id: { type: string, format: uuid }
        engine_group_name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        state: { type: string, enum: [active, expired, exhausted, revoked] }
        max_uses: { type: [integer, "null"] }
    JoinTokenCreate:
      type: object
      required: [name, ttl_seconds]
      properties:
        name: { type: string }
        ttl_seconds: { type: integer, minimum: 60, maximum: 31536000 }
        engine_group_id: { type: string, format: uuid }
        max_uses: { type: integer, minimum: 1, maximum: 100000 }
        labels:
          {
            type: object,
            additionalProperties: { type: string, maxLength: 63 },
            maxProperties: 32,
          }
    JoinTokenCreated:
      type: object
      required: [join_token, token]
      properties:
        {
          join_token: { $ref: "#/components/schemas/JoinToken" },
          token: { type: string },
        }
    ConfigVersion:
      type: object
      required: [version, created_at, created_by, summary]
      properties:
        {
          version: { type: integer, format: int64 },
          created_at: { type: string, format: date-time },
          created_by: { type: string },
          summary: { type: string },
        }
    ApiToken:
      type: object
      required: [id, user_id, name, prefix, role, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    ApiTokenCreate:
      type: object
      required: [name, role]
      properties:
        {
          name: { type: string },
          role: { $ref: "#/components/schemas/Role" },
          expires_at: { type: [string, "null"], format: date-time },
        }
    ApiTokenCreated:
      type: object
      required: [api_token, token]
      properties:
        {
          api_token: { $ref: "#/components/schemas/ApiToken" },
          token: { type: string },
        }
    AuditEvent:
      type: object
      required:
        [
          id,
          at,
          actor_type,
          actor_id,
          actor_name,
          action,
          target_type,
          target_id,
          diff,
        ]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, api_token, system] }
        actor_id: { type: string }
        actor_name: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        diff: { type: object, additionalProperties: true }
        config_version: { type: [integer, "null"], format: int64 }
    QueryLogRecord:
      type: object
      required:
        [
          time,
          client,
          name,
          qtype,
          rcode,
          cache,
          filter,
          upstream,
          transport,
          engine_id,
          duration_us,
        ]
      properties:
        time: { type: string, format: date-time }
        client: { type: string }
        name: { type: string }
        qtype: { type: string }
        rcode: { type: string }
        cache: { type: string, enum: [hit, miss, stale, none] }
        filter: { type: string, enum: [none, blocked, allowed, rewritten] }
        upstream: { type: string }
        transport: { type: string }
        engine_id: { type: string }
        duration_us: { type: integer, format: int64 }
    QueryLogPage:
      type: object
      required: [backend, records, next_cursor]
      properties:
        {
          backend: { type: string },
          records:
            {
              type: array,
              items: { $ref: "#/components/schemas/QueryLogRecord" },
            },
          next_cursor: { type: string },
        }
    Dashboard:
      type: object
      required:
        [
          queries_total,
          blocked_total,
          qps,
          cache_hit_ratio,
          engines_total,
          engines_connected,
          upstreams,
          series,
        ]
      properties:
        queries_total: { type: integer, format: int64 }
        blocked_total: { type: integer, format: int64 }
        qps: { type: number }
        cache_hit_ratio: { type: number }
        engines_total: { type: integer }
        engines_connected: { type: integer }
        upstreams:
          type: array
          items:
            {
              type: object,
              required: [name, up_engines, total_engines, rtt_ms],
              properties:
                {
                  name: { type: string },
                  up_engines: { type: integer },
                  total_engines: { type: integer },
                  rtt_ms: { type: number },
                },
            }
        series:
          type: array
          items:
            {
              type: object,
              required: [at, qps],
              properties:
                {
                  at: { type: string, format: date-time },
                  qps: { type: number },
                },
            }
    SafeSearch:
      type: object
      required: [google, bing, duckduckgo, youtube]
      properties:
        google: { type: boolean }
        bing: { type: boolean }
        duckduckgo: { type: boolean }
        youtube: { type: string, enum: ["off", moderate, strict] }
    GlobalSafeSearch:
      allOf:
        - { $ref: "#/components/schemas/SafeSearch" }
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, format: int64 }
    PolicyGroupInput:
      type: object
      required: [name, cidrs]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 _.-]{0,62}$" }
        description: { type: string, maxLength: 500, default: "" }
        cidrs:
          { type: array, minItems: 1, maxItems: 1024, items: { type: string } }
        filter_list_ids:
          {
            type: array,
            maxItems: 256,
            items: { type: string, format: uuid },
            default: [],
          }
        allowlist:
          { type: array, maxItems: 10000, items: { type: string }, default: [] }
        safe_search: { $ref: "#/components/schemas/SafeSearch" }
    PolicyGroupUpdate:
      allOf:
        - { $ref: "#/components/schemas/PolicyGroupInput" }
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, format: int64 }
    PolicyGroup:
      type: object
      required:
        [
          id,
          name,
          description,
          cidrs,
          filter_list_ids,
          allowlist,
          safe_search,
          revision,
          created_at,
          updated_at,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        cidrs: { type: array, items: { type: string } }
        filter_list_ids: { type: array, items: { type: string, format: uuid } }
        allowlist: { type: array, items: { type: string } }
        safe_search: { $ref: "#/components/schemas/SafeSearch" }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RewriteInput:
      type: object
      required: [name, type, value]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: null means global,
          }
        name:
          { type: string, maxLength: 255, description: "Domain or *.domain" }
        type: { type: string, enum: [A, AAAA, CNAME] }
        value: { type: string, maxLength: 255 }
        ttl: { type: integer, minimum: 0, maximum: 86400, default: 300 }
    RewriteUpdate:
      allOf:
        - { $ref: "#/components/schemas/RewriteInput" }
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, format: int64 }
    Rewrite:
      type: object
      required:
        [
          id,
          group_id,
          name,
          type,
          value,
          ttl,
          revision,
          created_at,
          updated_at,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        group_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        type: { type: string, enum: [A, AAAA, CNAME] }
        value: { type: string }
        ttl: { type: integer }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DnsTlsStatus:
      type: object
      required: [configured, certificate, engines]
      properties:
        configured: { type: boolean }
        certificate:
          type: ["object", "null"]
          required:
            [
              subject,
              dns_names,
              ip_addresses,
              not_before,
              not_after,
              fingerprint_sha256,
            ]
          properties:
            subject: { type: string }
            dns_names: { type: array, items: { type: string } }
            ip_addresses: { type: array, items: { type: string } }
            not_before: { type: string, format: date-time }
            not_after: { type: string, format: date-time }
            fingerprint_sha256: { type: string }
        engines:
          type: array
          items:
            type: object
            required:
              [
                engine_id,
                node_name,
                fingerprint_sha256,
                applied,
                error,
                updated_at,
              ]
            properties:
              engine_id: { type: string, format: uuid }
              node_name: { type: string }
              fingerprint_sha256: { type: string }
              applied: { type: boolean }
              error: { type: string }
              updated_at: { type: string, format: date-time }
    ResolutionSettings:
      type: object
      required:
        [
          mode,
          qname_minimisation,
          aggressive_nsec,
          max_upstream_queries,
          max_delegation_depth,
          authority_port,
          root_hints,
          revision,
        ]
      properties:
        mode: { type: string, enum: [forward, recursive] }
        qname_minimisation: { type: boolean }
        aggressive_nsec: { type: boolean }
        max_upstream_queries: { type: integer, minimum: 1, maximum: 1000 }
        max_delegation_depth: { type: integer, minimum: 1, maximum: 64 }
        authority_port: { type: integer, minimum: 1, maximum: 65535 }
        root_hints:
          { type: array, items: { $ref: "#/components/schemas/RootHint" } }
        revision: { type: integer, format: int64 }
    RootHint:
      type: object
      required: [name, addresses]
      properties:
        name: { type: string }
        addresses: { type: array, minItems: 1, items: { type: string } }
    ForwardZoneInput:
      type: object
      required: [domain, addresses, validate]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        domain: { type: string, maxLength: 255 }
        addresses:
          {
            type: array,
            minItems: 1,
            maxItems: 16,
            items: { type: string, description: "ip:port" },
          }
        validate: { type: boolean }
    ForwardZoneUpdate:
      allOf:
        - { $ref: "#/components/schemas/ForwardZoneInput" }
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, format: int64 }
    ForwardZone:
      type: object
      required: [id, domain, addresses, validate, revision, engine_group_id]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        domain: { type: string }
        addresses: { type: array, items: { type: string } }
        validate: { type: boolean }
        revision: { type: integer, format: int64 }
    DnssecSettings:
      type: object
      required: [validation, validate_forwarded, rfc5011, revision]
      properties:
        validation: { type: boolean }
        validate_forwarded:
          {
            type: boolean,
            description: "Validate answers from the global upstreams (forward mode) up to the root trust anchor; effective only with validation",
          }
        rfc5011: { type: boolean }
        revision: { type: integer, format: int64 }
    TrustAnchorInput:
      type: object
      required: [zone, ds]
      properties:
        zone: { type: string, maxLength: 255 }
        ds: { type: string, maxLength: 200 }
    TrustAnchor:
      type: object
      required: [id, zone, ds, source, created_at]
      properties:
        id: { type: string, format: uuid }
        zone: { type: string }
        ds: { type: string }
        source: { type: string, enum: [iana, operator] }
        created_at: { type: string, format: date-time }
    NegativeTrustAnchorInput:
      type: object
      required: [domain, expires_at]
      properties:
        domain: { type: string, maxLength: 255 }
        reason: { type: string, maxLength: 500, default: "" }
        expires_at:
          {
            type: string,
            format: date-time,
            description: "in the future and at most 30 days ahead",
          }
    NegativeTrustAnchor:
      type: object
      required: [id, domain, reason, expires_at, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        domain: { type: string }
        reason: { type: string }
        expires_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    DnssecStatus:
      type: object
      required: [engines]
      properties:
        engines:
          type: array
          items:
            type: object
            required:
              [
                engine_id,
                engine_name,
                reported_at,
                secure,
                insecure,
                bogus,
                indeterminate,
                active_negative_trust_anchors,
                trust_anchors,
              ]
            properties:
              engine_id: { type: string, format: uuid }
              engine_name: { type: string }
              reported_at: { type: string, format: date-time }
              secure: { type: integer, format: int64 }
              insecure: { type: integer, format: int64 }
              bogus: { type: integer, format: int64 }
              indeterminate: { type: integer, format: int64 }
              active_negative_trust_anchors: { type: integer }
              trust_anchors:
                type: array
                items:
                  type: object
                  required:
                    [
                      zone,
                      key_tag,
                      algorithm,
                      state,
                      last_refresh_success,
                      hold_down_until,
                      last_error,
                    ]
                  properties:
                    zone: { type: string }
                    key_tag: { type: integer }
                    algorithm: { type: integer }
                    state:
                      {
                        type: string,
                        enum: [configured, add_pend, valid, missing, revoked],
                      }
                    last_refresh_success:
                      { type: [string, "null"], format: date-time }
                    hold_down_until:
                      { type: [string, "null"], format: date-time }
                    last_error: { type: string }
    RpzZoneInput:
      type: object
      required: [name, source_type, min_refresh_seconds, policy_override]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name: { type: string, maxLength: 255 }
        source_type: { type: string, enum: [file, transfer] }
        primary:
          { type: [string, "null"], description: "ip:port, transfer only" }
        tsig_key_name: { type: [string, "null"] }
        tsig_algorithm:
          { type: [string, "null"], enum: [hmac-sha256, hmac-sha512, null] }
        tsig_secret:
          {
            type: [string, "null"],
            writeOnly: true,
            description: "base64, 16-64 bytes; stored sealed under NEXORA_KEK_FILE; omit on update to keep the stored secret",
          }
        min_refresh_seconds: { type: integer, minimum: 1, maximum: 86400 }
        policy_override:
          {
            type: string,
            enum: [given, disabled, nxdomain, nodata, passthru, drop, tcp_only],
          }
    RpzZoneUpdate:
      type: object
      required: [min_refresh_seconds, policy_override, revision]
      properties:
        primary: { type: [string, "null"] }
        tsig_key_name: { type: [string, "null"] }
        tsig_algorithm:
          { type: [string, "null"], enum: [hmac-sha256, hmac-sha512, null] }
        tsig_secret: { type: [string, "null"], writeOnly: true }
        min_refresh_seconds: { type: integer, minimum: 1, maximum: 86400 }
        policy_override:
          {
            type: string,
            enum: [given, disabled, nxdomain, nodata, passthru, drop, tcp_only],
          }
        revision: { type: integer, format: int64 }
    RpzZone:
      type: object
      required:
        [
          id,
          name,
          position,
          source_type,
          primary,
          tsig_key_name,
          tsig_algorithm,
          tsig_secret_set,
          min_refresh_seconds,
          policy_override,
          file_records,
          revision,
          status,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        source_type: { type: string, enum: [file, transfer] }
        primary: { type: [string, "null"] }
        tsig_key_name: { type: [string, "null"] }
        tsig_algorithm: { type: [string, "null"] }
        tsig_secret_set: { type: boolean }
        min_refresh_seconds: { type: integer }
        policy_override: { type: string }
        file_records: { type: [integer, "null"] }
        revision: { type: integer, format: int64 }
        status:
          type: array
          items:
            type: object
            required:
              [
                engine_id,
                engine_name,
                serial,
                records,
                skipped,
                hits,
                last_success,
                last_error,
                stale,
              ]
            properties:
              engine_id: { type: string, format: uuid }
              engine_name: { type: string }
              serial: { type: integer, format: int64 }
              records: { type: integer, format: int64 }
              skipped: { type: integer, format: int64 }
              hits: { type: integer, format: int64 }
              last_success: { type: [string, "null"], format: date-time }
              last_error: { type: string }
              stale: { type: boolean }
    RpzZoneFile:
      type: object
      required: [content, revision]
      properties:
        content: { type: string, maxLength: 3145728 }
        revision: { type: integer, format: int64 }
    RpzZoneOrder:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    ZoneEndpoint:
      type: object
      required: [address]
      properties:
        address: { type: string, description: "ip:port" }
        tsig_key_id: { type: [string, "null"], format: uuid }
    ZoneTransfer:
      type: object
      required: [allow_cidrs]
      properties:
        allow_cidrs:
          {
            type: array,
            items: { type: string },
            description: "Clients allowed to transfer the zone; empty refuses transfers.",
          }
        tsig_key_id: { type: [string, "null"], format: uuid }
    ZoneUpdatePolicy:
      type: object
      required: [tsig_key_ids]
      properties:
        tsig_key_ids:
          {
            type: array,
            items: { type: string, format: uuid },
            description: "TSIG keys allowed to send dynamic updates; empty refuses updates.",
          }
    ZoneSOA:
      type: object
      required: [mname, rname, refresh, retry, expire, minimum, ttl]
      properties:
        mname: { type: string }
        rname: { type: string }
        refresh: { type: integer, format: int64 }
        retry: { type: integer, format: int64 }
        expire: { type: integer, format: int64 }
        minimum: { type: integer, format: int64 }
        ttl: { type: integer, format: int64 }
    ZoneSOAInput:
      type: object
      required: [mname, rname]
      description: Omitted or zero timers take the defaults (refresh 10800, retry 3600, expire 1209600, minimum 3600, ttl 3600) on create and keep the current values on update.
      properties:
        mname: { type: string }
        rname: { type: string }
        refresh:
          { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        retry: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        expire:
          { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        minimum:
          { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        ttl: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
    ZoneSecondaryStatus:
      type: object
      required:
        [
          last_refresh_at,
          last_success_at,
          next_refresh_at,
          expires_at,
          expired,
          last_error,
          last_trigger,
        ]
      properties:
        last_refresh_at: { type: [string, "null"], format: date-time }
        last_success_at: { type: [string, "null"], format: date-time }
        next_refresh_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        expired: { type: boolean }
        last_error: { type: string }
        last_trigger: { type: string }
    Zone:
      type: object
      required:
        [
          id,
          name,
          kind,
          revision,
          serial,
          default_ttl,
          soa,
          transfer,
          notify,
          update,
          primaries,
          dnssec_enabled,
          created_at,
          updated_at,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [primary, secondary] }
        revision: { type: integer, format: int64 }
        serial: { type: integer, format: int64 }
        default_ttl: { type: integer, format: int64 }
        soa: { $ref: "#/components/schemas/ZoneSOA" }
        transfer: { $ref: "#/components/schemas/ZoneTransfer" }
        notify:
          { type: array, items: { $ref: "#/components/schemas/ZoneEndpoint" } }
        update: { $ref: "#/components/schemas/ZoneUpdatePolicy" }
        primaries:
          { type: array, items: { $ref: "#/components/schemas/ZoneEndpoint" } }
        secondary_status:
          {
            $ref: "#/components/schemas/ZoneSecondaryStatus",
            description: "Present for secondary zones only.",
          }
        dnssec_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ZoneCreate:
      type: object
      required: [name, kind]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name:
          { type: string, maxLength: 255, description: "Absolute zone name." }
        kind: { type: string, enum: [primary, secondary] }
        default_ttl:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 2147483647,
            description: "Default 3600 when omitted.",
          }
        soa:
          allOf: [{ $ref: "#/components/schemas/ZoneSOAInput" }]
          description: "Required for primary zones; secondary zones take the SOA of their primary."
        nameservers:
          {
            type: array,
            items: { type: string },
            description: "Primary zones: at least one apex NS target.",
          }
        primaries:
          {
            type: array,
            items: { $ref: "#/components/schemas/ZoneEndpoint" },
            description: "Secondary zones: at least one primary.",
          }
        transfer: { $ref: "#/components/schemas/ZoneTransfer" }
        notify:
          { type: array, items: { $ref: "#/components/schemas/ZoneEndpoint" } }
        update: { $ref: "#/components/schemas/ZoneUpdatePolicy" }
    ZoneUpdate:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }
        default_ttl:
          { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        soa: { $ref: "#/components/schemas/ZoneSOAInput" }
        primaries:
          { type: array, items: { $ref: "#/components/schemas/ZoneEndpoint" } }
        transfer: { $ref: "#/components/schemas/ZoneTransfer" }
        notify:
          { type: array, items: { $ref: "#/components/schemas/ZoneEndpoint" } }
        update: { $ref: "#/components/schemas/ZoneUpdatePolicy" }
    RecordInput:
      type: object
      required: [name, type, ttl, data]
      properties:
        name:
          {
            type: string,
            maxLength: 255,
            description: "Absolute owner name inside the zone.",
          }
        type:
          {
            type: string,
            enum:
              [
                A,
                AAAA,
                CAA,
                CNAME,
                DNAME,
                DS,
                HTTPS,
                LOC,
                MX,
                NAPTR,
                NS,
                PTR,
                SRV,
                SSHFP,
                SVCB,
                TLSA,
                TXT,
              ],
          }
        ttl: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        data:
          {
            type: string,
            maxLength: 65535,
            description: "RDATA in presentation format.",
          }
    RecordUpdate:
      type: object
      required: [name, type, ttl, data, revision]
      properties:
        name: { type: string, maxLength: 255 }
        type:
          {
            type: string,
            enum:
              [
                A,
                AAAA,
                CAA,
                CNAME,
                DNAME,
                DS,
                HTTPS,
                LOC,
                MX,
                NAPTR,
                NS,
                PTR,
                SRV,
                SSHFP,
                SVCB,
                TLSA,
                TXT,
              ],
          }
        ttl: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        data: { type: string, maxLength: 65535 }
        revision: { type: integer, format: int64 }
    Record:
      type: object
      required: [id, name, type, ttl, data, revision]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        ttl: { type: integer, format: int64 }
        data: { type: string }
        revision: { type: integer, format: int64 }
    ZoneImport:
      type: object
      required: [revision, content]
      properties:
        revision: { type: integer, format: int64 }
        content:
          {
            type: string,
            description: "BIND master file; $INCLUDE and $GENERATE are refused. Request bodies may be up to 64 MiB.",
          }
    ZoneImportResult:
      type: object
      required: [zone, records_imported]
      properties:
        zone: { $ref: "#/components/schemas/Zone" }
        records_imported: { type: integer }
    RecordPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Record" } }
        next_cursor: { type: [string, "null"] }
    ZoneDnssecKey:
      type: object
      required:
        [
          id,
          role,
          algorithm,
          key_tag,
          flags,
          state,
          ds_state,
          backend,
          public_key,
          published_at,
          activated_at,
          retired_at,
          removed_at,
        ]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [ksk, zsk] }
        algorithm: { type: integer }
        key_tag: { type: integer }
        flags: { type: integer }
        state: { type: string, enum: [published, active, retired, removed] }
        ds_state:
          {
            type: string,
            enum: [none, pending, seen],
            description: "KSKs: whether the parent's DS for this key is pending or was confirmed.",
          }
        backend: { type: string, enum: [kek, pkcs11] }
        public_key:
          { type: string, description: "DNSKEY public key field (base64)." }
        published_at: { type: string, format: date-time }
        activated_at: { type: [string, "null"], format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
    ZoneDnssec:
      type: object
      required:
        [
          enabled,
          algorithm,
          nsec_mode,
          key_backend,
          propagation_delay_seconds,
          parent_ds_ttl_seconds,
          zsk_lifetime_days,
          keys,
          ds,
          dnskeys,
        ]
      properties:
        enabled: { type: boolean }
        algorithm: { type: integer, enum: [8, 13] }
        nsec_mode: { type: string, enum: [nsec, nsec3] }
        key_backend:
          {
            type: string,
            description: "kek or pkcs11; empty when no key storage is configured.",
          }
        propagation_delay_seconds: { type: integer }
        parent_ds_ttl_seconds: { type: integer }
        zsk_lifetime_days:
          { type: integer, description: "0 means manual ZSK rollovers only." }
        keys:
          { type: array, items: { $ref: "#/components/schemas/ZoneDnssecKey" } }
        ds:
          {
            type: array,
            items: { type: string },
            description: "DS records (SHA-256) of the newest active KSK, to publish at the parent.",
          }
        dnskeys:
          {
            type: array,
            items: { type: string },
            description: "The served DNSKEY RRset in presentation form.",
          }
    ZoneDnssecUpdate:
      type: object
      required: [revision, enabled]
      properties:
        revision:
          { type: integer, format: int64, description: "Zone revision." }
        enabled: { type: boolean }
        algorithm:
          {
            type: integer,
            enum: [8, 13],
            description: "Default 13 (ECDSA P-256); cannot change while signing is enabled.",
          }
        nsec_mode:
          { type: string, enum: [nsec, nsec3], description: "Default nsec3." }
        key_backend:
          {
            type: string,
            enum: [kek, pkcs11],
            description: "Default pkcs11 when a token is configured, else kek.",
          }
        propagation_delay_seconds:
          { type: integer, minimum: 1, maximum: 604800 }
        parent_ds_ttl_seconds: { type: integer, minimum: 1, maximum: 604800 }
        zsk_lifetime_days: { type: integer, minimum: 0, maximum: 3650 }
    ZoneKeyRollover:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [zsk, ksk] }
    ZoneKskDsPublished:
      type: object
      required: [key_id]
      properties:
        key_id: { type: string, format: uuid }
    TsigKeyAlgorithm:
      type: string
      enum: [hmac-sha256, hmac-sha384, hmac-sha512]
    TsigKey:
      type: object
      description: A TSIG key. The secret is write-only and returned once, on create.
      required: [id, name, algorithm, revision, created_at]
      properties:
        id: { type: string, format: uuid }
        name:
          {
            type: string,
            description: "Absolute key name, lowercase (e.g. xfr-key.).",
          }
        algorithm: { $ref: "#/components/schemas/TsigKeyAlgorithm" }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    TsigKeyCreate:
      type: object
      required: [name, algorithm]
      properties:
        name: { type: string }
        algorithm: { $ref: "#/components/schemas/TsigKeyAlgorithm" }
        secret:
          type: string
          description: Base64 of 16..64 bytes; omitted, a random secret of the HMAC output size is generated.
    TsigKeyCreated:
      allOf:
        - { $ref: "#/components/schemas/TsigKey" }
        - type: object
          required: [secret]
          properties:
            secret:
              {
                type: string,
                description: "Base64 secret; shown only in this response.",
              }
    RolloutState:
      {
        type: string,
        enum:
          [
            pending,
            canary,
            verifying,
            rolling,
            completed,
            halted,
            rolled_back,
            superseded,
          ],
      }
    EngineGroupInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        description: { type: string, maxLength: 1024 }
        upstream_mode: { type: string, enum: [inherit, override] }
        extra_acl_cidrs: { type: array, items: { type: string }, maxItems: 256 }
        otlp_endpoint: { type: string, maxLength: 512 }
        rollout_strategy: { type: string, enum: [all_at_once, canary] }
        canary_count: { type: integer, minimum: 0 }
        canary_percent: { type: integer, minimum: 0, maximum: 100 }
        ack_timeout_seconds: { type: integer, minimum: 5, maximum: 3600 }
        health_window_seconds: { type: integer, minimum: 20, maximum: 3600 }
        max_servfail_ratio: { type: number, minimum: 0, maximum: 1 }
        min_health_queries: { type: integer, minimum: 0 }
    EngineGroupUpdate:
      allOf:
        - { $ref: "#/components/schemas/EngineGroupInput" }
        - {
            type: object,
            required: [revision],
            properties: { revision: { type: integer, format: int64 } },
          }
    EngineGroup:
      type: object
      required:
        [
          id,
          name,
          description,
          upstream_mode,
          extra_acl_cidrs,
          otlp_endpoint,
          rollout_strategy,
          canary_count,
          canary_percent,
          ack_timeout_seconds,
          health_window_seconds,
          max_servfail_ratio,
          min_health_queries,
          rollouts_paused,
          engine_count,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        upstream_mode: { type: string, enum: [inherit, override] }
        extra_acl_cidrs: { type: array, items: { type: string } }
        otlp_endpoint: { type: string }
        rollout_strategy: { type: string, enum: [all_at_once, canary] }
        canary_count: { type: integer }
        canary_percent: { type: integer }
        ack_timeout_seconds: { type: integer }
        health_window_seconds: { type: integer }
        max_servfail_ratio: { type: number }
        min_health_queries: { type: integer }
        rollouts_paused: { type: boolean }
        stable_version: { type: [integer, "null"], format: int64 }
        engine_count: { type: integer }
        active_rollout:
          {
            oneOf: [{ $ref: "#/components/schemas/Rollout" }, { type: "null" }],
          }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Rollout:
      type: object
      required:
        [
          id,
          engine_group_id,
          engine_group_name,
          version,
          kind,
          strategy,
          state,
          canary_engine_ids,
          halt_reason,
          created_by,
          created_at,
          progress,
        ]
      properties:
        id: { type: string, format: uuid }
        engine_group_id: { type: string, format: uuid }
        engine_group_name: { type: string }
        version: { type: integer, format: int64 }
        from_version: { type: [integer, "null"], format: int64 }
        kind: { type: string, enum: [change, rollback, republish] }
        strategy: { type: string, enum: [all_at_once, canary] }
        state: { $ref: "#/components/schemas/RolloutState" }
        canary_engine_ids:
          { type: array, items: { type: string, format: uuid } }
        phase_started_at: { type: [string, "null"], format: date-time }
        halt_reason: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        progress:
          type: object
          required: [total, applied, rejected]
          properties:
            {
              total: { type: integer },
              applied: { type: integer },
              rejected: { type: integer },
            }
    RolloutDetail:
      allOf:
        - { $ref: "#/components/schemas/Rollout" }
        - type: object
          required: [engines]
          properties:
            engines:
              type: array
              items:
                type: object
                required:
                  [
                    engine_id,
                    node_name,
                    canary,
                    connected,
                    applied_version,
                    progress,
                    rejected_reason,
                  ]
                properties:
                  engine_id: { type: string, format: uuid }
                  node_name: { type: string }
                  canary: { type: boolean }
                  connected: { type: boolean }
                  applied_version: { type: integer, format: int64 }
                  progress:
                    {
                      type: string,
                      enum: [waiting, applied, rejected, disconnected],
                    }
                  rejected_reason: { type: string }
    EngineUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }
        engine_group_id: { type: string, format: uuid }
        labels:
          {
            type: object,
            additionalProperties: { type: string, maxLength: 63 },
            maxProperties: 32,
          }
    EngineStats:
      type: object
      required: [window, samples]
      properties:
        window: { type: string, enum: [5m, 1h, 24h] }
        samples:
          type: array
          items:
            type: object
            required: [at, qps, cache_hit_ratio, servfail_ratio, p99_ms]
            properties:
              at: { type: string, format: date-time }
              qps: { type: number }
              cache_hit_ratio: { type: number }
              servfail_ratio: { type: number }
              p99_ms: { type: number }
    FleetSummary:
      type: object
      required:
        [engines_total, engines_by_status, halted_rollouts, engine_groups]
      properties:
        engines_total: { type: integer }
        engines_by_status:
          { type: object, additionalProperties: { type: integer } }
        halted_rollouts: { type: integer }
        engine_groups:
          type: array
          items:
            type: object
            required:
              [id, name, engines, connected, rollout_strategy, rollouts_paused]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              engines: { type: integer }
              connected: { type: integer }
              rollout_strategy: { type: string, enum: [all_at_once, canary] }
              rollouts_paused: { type: boolean }
              stable_version: { type: [integer, "null"], format: int64 }
              active_rollout:
                {
                  oneOf:
                    [
                      { $ref: "#/components/schemas/Rollout" },
                      { type: "null" },
                    ],
                }
