      properties:
        name:
          {
            type: string,
            maxLength: 255,
            description: "Absolute owner name inside the zone.",
          }
        type:
          {
            type: string,
            enum:
              [
                A,
                AAAA,
                CAA,
                CNAME,
                DNAME,
                DS,
                HTTPS,
                LOC,
                MX,
                NAPTR,
                NS,
                PTR,
                SRV,
                SSHFP,
                SVCB,
                TLSA,
                TXT,
              ],
          }
        ttl: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        data:
          {
            type: string,
            maxLength: 65535,
            description: "RDATA in presentation format.",
          }
    RecordUpdate:
      type: object
      required: [name, type, ttl, data, revision]
      properties:
        name: { type: string, maxLength: 255 }
        type:
          {
            type: string,
            enum:
              [
                A,
                AAAA,
                CAA,
                CNAME,
                DNAME,
                DS,
                HTTPS,
                LOC,
                MX,
                NAPTR,
                NS,
                PTR,
                SRV,
                SSHFP,
                SVCB,
                TLSA,
                TXT,
              ],
          }
        ttl: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        data: { type: string, maxLength: 65535 }
        revision: { type: integer, format: int64 }
    Record:
      type: object
      required: [id, name, type, ttl, data, revision]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        ttl: { type: integer, format: int64 }
        data: { type: string }
        revision: { type: integer, format: int64 }
    ZoneImport:
      type: object
      required: [revision, content]
      properties:
        revision: { type: integer, format: int64 }
        content:
          {
            type: string,
            description: "BIND master file; $INCLUDE and $GENERATE are refused. Request bodies may be up to 64 MiB.",
          }
    ZoneImportResult:
      type: object
      required: [zone, records_imported]
      properties:
        zone: { $ref: "#/components/schemas/Zone" }
        records_imported: { type: integer }
    RecordPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Record" } }
        next_cursor: { type: [string, "null"] }
    ZoneDnssecKey:
      type: object
      required:
        [
          id,
          role,
          algorithm,
          key_tag,
          flags,
          state,
          ds_state,
          backend,
          public_key,
          published_at,
          activated_at,
          retired_at,
          removed_at,
        ]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [ksk, zsk] }
        algorithm: { type: integer }
        key_tag: { type: integer }
        flags: { type: integer }
        state: { type: string, enum: [published, active, retired, removed] }
        ds_state:
          {
            type: string,
            enum: [none, pending, seen],
            description: "KSKs: whether the parent's DS for this key is pending or was confirmed.",
          }
        backend: { type: string, enum: [kek, pkcs11] }
        public_key:
          { type: string, description: "DNSKEY public key field (base64)." }
        published_at: { type: string, format: date-time }
        activated_at: { type: [string, "null"], format: date-time }
        retired_at: { type: [string, "null"], format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
    ZoneDnssec:
      type: object
      required:
        [
          enabled,
          algorithm,
          nsec_mode,
          key_backend,
          propagation_delay_seconds,
          parent_ds_ttl_seconds,
          zsk_lifetime_days,
          keys,
          ds,
          dnskeys,
        ]
      properties:
        enabled: { type: boolean }
        algorithm: { type: integer, enum: [8, 13] }
        nsec_mode: { type: string, enum: [nsec, nsec3] }
        key_backend:
          {
            type: string,
            description: "kek or pkcs11; empty when no key storage is configured.",
          }
        propagation_delay_seconds: { type: integer }
        parent_ds_ttl_seconds: { type: integer }
        zsk_lifetime_days:
          { type: integer, description: "0 means manual ZSK rollovers only." }
        keys:
          { type: array, items: { $ref: "#/components/schemas/ZoneDnssecKey" } }
        ds:
          {
            type: array,
            items: { type: string },
            description: "DS records (SHA-256) of the newest active KSK, to publish at the parent.",
          }
        dnskeys:
          {
            type: array,
            items: { type: string },
            description: "The served DNSKEY RRset in presentation form.",
          }
    ZoneDnssecUpdate:
      type: object
      required: [revision, enabled]
      properties:
        revision:
          { type: integer, format: int64, description: "Zone revision." }
        enabled: { type: boolean }
        algorithm:
          {
            type: integer,
            enum: [8, 13],
            description: "Default 13 (ECDSA P-256); cannot change while signing is enabled.",
          }
        nsec_mode:
          { type: string, enum: [nsec, nsec3], description: "Default nsec3." }
        key_backend:
          {
            type: string,
            enum: [kek, pkcs11],
            description: "Default pkcs11 when a token is configured, else kek.",
          }
        propagation_delay_seconds:
          { type: integer, minimum: 1, maximum: 604800 }
        parent_ds_ttl_seconds: { type: integer, minimum: 1, maximum: 604800 }
        zsk_lifetime_days: { type: integer, minimum: 0, maximum: 3650 }
    ZoneKeyRollover:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [zsk, ksk] }
    ZoneKskDsPublished:
      type: object
      required: [key_id]
      properties:
        key_id: { type: string, format: uuid }
    TsigKeyAlgorithm:
      type: string
      enum: [hmac-sha256, hmac-sha384, hmac-sha512]
    TsigKey:
      type: object
      description: A TSIG key. The secret is write-only and returned once, on create.
      required: [id, name, algorithm, revision, created_at]
      properties:
        id: { type: string, format: uuid }
        name:
          {
            type: string,
            description: "Absolute key name, lowercase (e.g. xfr-key.).",
          }
        algorithm: { $ref: "#/components/schemas/TsigKeyAlgorithm" }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    TsigKeyCreate:
      type: object
      required: [name, algorithm]
      properties:
        name: { type: string }
        algorithm: { $ref: "#/components/schemas/TsigKeyAlgorithm" }
        secret:
          type: string
          description: Base64 of 16..64 bytes; omitted, a random secret of the HMAC output size is generated.
    TsigKeyCreated:
      allOf:
        - { $ref: "#/components/schemas/TsigKey" }
        - type: object
          required: [secret]
          properties:
            secret:
              {
                type: string,
                description: "Base64 secret; shown only in this response.",
              }
    RolloutState:
      {
        type: string,
        enum:
          [
            pending,
            canary,
            verifying,
            rolling,
            completed,
            halted,
            rolled_back,
            superseded,
          ],
      }
    # No additionalProperties: false here. EngineGroupUpdate is an allOf of this schema and revision,
    # and a closed base makes that allOf unsatisfiable, so no updateEngineGroup body could validate.
    # Unknown fields are still rejected: proposal action bodies go through proposal.unknownFields, and
    # the handlers decode into the generated structs.
    EngineGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        description: { type: string, maxLength: 1024 }
        upstream_mode: { type: string, enum: [inherit, override] }
        extra_acl_cidrs: { type: array, items: { type: string }, maxItems: 256 }
        otlp_endpoint: { type: string, maxLength: 512 }
        rollout_strategy: { type: string, enum: [all_at_once, canary] }
        canary_count: { type: integer, minimum: 0 }
        canary_percent: { type: integer, minimum: 0, maximum: 100 }
        ack_timeout_seconds: { type: integer, minimum: 5, maximum: 3600 }
        health_window_seconds: { type: integer, minimum: 20, maximum: 3600 }
        max_servfail_ratio: { type: number, minimum: 0, maximum: 1 }
        min_health_queries: { type: integer, minimum: 0 }
        filter_index_max_bytes:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: "filter index memory cap of this group's engines; 0 = engine default (50% of the cgroup memory limit, else 512 MiB), otherwise at least 16777216",
          }
        mdns: { $ref: "#/components/schemas/MdnsSettings" }
    EngineGroupUpdate:
      allOf:
        - { $ref: "#/components/schemas/EngineGroupInput" }
        - {
            type: object,
            required: [revision],
            properties: { revision: { type: integer, format: int64 } },
          }
    EngineGroup:
      type: object
      required:
        [
          id,
          name,
          description,
          upstream_mode,
          extra_acl_cidrs,
          otlp_endpoint,
          rollout_strategy,
          canary_count,
          canary_percent,
          ack_timeout_seconds,
          health_window_seconds,
          max_servfail_ratio,
          min_health_queries,
          rollouts_paused,
          engine_count,
          filter_index_max_bytes,
          mdns,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        upstream_mode: { type: string, enum: [inherit, override] }
        extra_acl_cidrs: { type: array, items: { type: string } }
        otlp_endpoint: { type: string }
        rollout_strategy: { type: string, enum: [all_at_once, canary] }
        canary_count: { type: integer }
        canary_percent: { type: integer }
        ack_timeout_seconds: { type: integer }
        health_window_seconds: { type: integer }
        max_servfail_ratio: { type: number }
        min_health_queries: { type: integer }
        rollouts_paused: { type: boolean }
        filter_index_max_bytes: { type: integer, format: int64 }
        mdns: { $ref: "#/components/schemas/MdnsSettings" }
        stable_version: { type: [integer, "null"], format: int64 }
        engine_count: { type: integer }
        active_rollout:
          {
            oneOf: [{ $ref: "#/components/schemas/Rollout" }, { type: "null" }],
          }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Rollout:
      type: object
      required:
        [
          id,
          engine_group_id,
          engine_group_name,
          version,
          kind,
          strategy,
          state,
          canary_engine_ids,
          halt_reason,
          created_by,
          created_at,
          progress,
        ]
      properties:
        id: { type: string, format: uuid }
        engine_group_id: { type: string, format: uuid }
        engine_group_name: { type: string }
        version: { type: integer, format: int64 }
        from_version: { type: [integer, "null"], format: int64 }
        kind: { type: string, enum: [change, rollback, republish] }
        strategy: { type: string, enum: [all_at_once, canary] }
        state: { $ref: "#/components/schemas/RolloutState" }
        canary_engine_ids:
          { type: array, items: { type: string, format: uuid } }
        phase_started_at: { type: [string, "null"], format: date-time }
        halt_reason: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        progress:
          type: object
          required: [total, applied, rejected]
          properties:
            {
              total: { type: integer },
              applied: { type: integer },
              rejected: { type: integer },
            }
    RolloutDetail:
      allOf:
        - { $ref: "#/components/schemas/Rollout" }
        - type: object
          required: [engines]
          properties:
            engines:
              type: array
              items:
                type: object
                required:
                  [
                    engine_id,
                    node_name,
                    canary,
                    connected,
                    applied_version,
                    progress,
                    rejected_reason,
                  ]
                properties:
                  engine_id: { type: string, format: uuid }
                  node_name: { type: string }
                  canary: { type: boolean }
                  connected: { type: boolean }
                  applied_version: { type: integer, format: int64 }
                  progress:
                    {
                      type: string,
                      enum: [waiting, applied, rejected, disconnected],
                    }
                  rejected_reason: { type: string }
    EngineUpdate:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }
        engine_group_id: { type: string, format: uuid }
        labels:
          {
            type: object,
            additionalProperties: { type: string, maxLength: 63 },
            maxProperties: 32,
          }
    EngineStats:
      type: object
      required: [window, samples]
      properties:
        window: { type: string, enum: [5m, 1h, 24h] }
        samples:
          type: array
          items:
            type: object
            required: [at, qps, cache_hit_ratio, servfail_ratio, p99_ms]
            properties:
              at: { type: string, format: date-time }
              qps: { type: number }
              cache_hit_ratio: { type: number }
              servfail_ratio: { type: number }
              p99_ms: { type: number }
        filter_index:
          type: [object, "null"]
          required:
            [
              at,
              entries,
              bytes,
              max_bytes,
              build_seconds,
              decision_ns_blocked,
              decision_ns_clean,
              cpu,
            ]
          properties:
            at: { type: string, format: date-time }
            entries: { type: integer, format: int64 }
            bytes: { type: integer, format: int64 }
            max_bytes: { type: integer, format: int64 }
            build_seconds: { type: number }
            decision_ns_blocked: { type: number }
            decision_ns_clean: { type: number }
            cpu: { type: string }
    DashboardSeries:
      type: object
      required: [range, step_seconds, points, engines]
      properties:
        range: { type: string, enum: [15m, 1h, 6h, 24h, 7d] }
        step_seconds: { type: integer }
        points:
          type: array
          items:
            type: object
            required:
              [
                at,
                qps,
                qps_by_transport,
                qps_by_rcode,
                p50_ms,
                p95_ms,
                p99_ms,
                miss_p50_ms,
                miss_p95_ms,
                miss_p99_ms,
                cache_hit_ratio,
                cache_miss_ratio,
                cache_stale_ratio,
                blocked_qps,
                rewritten_qps,
                blocked_by_category,
                answers_by_route,
                recursion_upstream_qps,
                recursion_timeouts_qps,
                lame_marked,
                resolution_failures_qps,
                dnssec_secure_qps,
                dnssec_insecure_qps,
                dnssec_bogus_qps,
              ]
            properties:
              at: { type: string, format: date-time }
              qps: { type: number }
              qps_by_transport:
                { type: object, additionalProperties: { type: number } }
              qps_by_rcode:
                { type: object, additionalProperties: { type: number } }
              p50_ms: { type: number }
              p95_ms: { type: number }
              p99_ms: { type: number }
              miss_p50_ms: { type: number }
              miss_p95_ms: { type: number }
              miss_p99_ms: { type: number }
              cache_hit_ratio: { type: number }
              cache_miss_ratio: { type: number }
              cache_stale_ratio: { type: number }
              blocked_qps: { type: number }
              rewritten_qps: { type: number }
              blocked_by_category:
                { type: object, additionalProperties: { type: number } }
              answers_by_route:
                { type: object, additionalProperties: { type: number } }
              recursion_upstream_qps: { type: number }
              recursion_timeouts_qps: { type: number }
              lame_marked: { type: number }
              resolution_failures_qps: { type: number }
              dnssec_secure_qps: { type: number }
              dnssec_insecure_qps: { type: number }
              dnssec_bogus_qps: { type: number }
        engines:
          type: array
          items:
            type: object
            required:
              [
                engine_id,
                node_name,
                cache_entries,
                cache_bytes,
                filter_index_bytes,
              ]
            properties:
              engine_id: { type: string, format: uuid }
              node_name: { type: string }
              cache_entries: { type: integer, format: int64 }
              cache_bytes: { type: integer, format: int64 }
              filter_index_bytes: { type: integer, format: int64 }
    DashboardTop:
      type: object
      required:
        [range, available, domains, blocked_domains, clients, categories]
      properties:
        range: { type: string, enum: [15m, 1h, 6h, 24h, 7d] }
        available:
          {
            type: boolean,
            description: "false when the query log backend cannot aggregate; the lists are then empty",
          }
        domains:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer, format: int64 }
        blocked_domains:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer, format: int64 }
        clients:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer, format: int64 }
        categories:
          type: array
          items:
            type: object
            required: [key, count]
            properties:
              key: { type: string }
              count: { type: integer, format: int64 }
    DashboardHealth:
      type: object
      required: [engines, groups, alerts]
      properties:
        engines:
          type: array
          items:
            type: object
            required:
              [
                id,
                node_name,
                engine_group_name,
                status,
                qps,
                p99_ms,
                cache_hit_ratio,
                filter_index_bytes,
                applied_version,
                target_version,
              ]
            properties:
              id: { type: string, format: uuid }
              node_name: { type: string }
              engine_group_name: { type: string }
              status: { type: string }
              qps: { type: number }
              p99_ms: { type: number }
              cache_hit_ratio: { type: number }
              filter_index_bytes: { type: integer, format: int64 }
              applied_version: { type: integer, format: int64 }
              target_version: { type: integer, format: int64 }
        groups:
          type: array
          items:
            type: object
            required: [id, name, engines, connected]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              engines: { type: integer }
              connected: { type: integer }
        alerts:
          type: array
          items:
            type: object
            required: [kind, severity, subject, message]
            properties:
              kind:
                type: string
                enum:
                  [
                    engine_disconnected,
                    category_stale,
                    upstream_down,
                    certificate_expiring,
                    trust_anchor_refresh_failed,
                    export_dropped,
                  ]
              severity: { type: string, enum: [warning, critical] }
              subject: { type: string }
              message: { type: string }
    EngineMetrics:
      type: object
      required: [window, samples, upstreams, started_at, restarts, filter_index]
      properties:
        window: { type: string, enum: [5m, 1h, 24h] }
        samples:
          type: array
          items:
            type: object
            required:
              [
                at,
                qps,
                p50_ms,
                p99_ms,
                cache_hit_ratio,
                servfail_ratio,
                nxdomain_ratio,
                refused_ratio,
                blocked_qps,
                cpu_cores,
                resident_bytes,
                memory_limit_bytes,
                connections,
              ]
            properties:
              at: { type: string, format: date-time }
              qps: { type: number }
              p50_ms: { type: number }
              p99_ms: { type: number }
              cache_hit_ratio: { type: number }
              servfail_ratio: { type: number }
              nxdomain_ratio: { type: number }
              refused_ratio: { type: number }
              blocked_qps: { type: number }
              cpu_cores: { type: number }
              resident_bytes: { type: integer, format: int64 }
              memory_limit_bytes: { type: integer, format: int64 }
              connections:
                { type: object, additionalProperties: { type: number } }
        upstreams:
          type: array
          items:
            type: object
            required: [name, samples]
            properties:
              name: { type: string }
              samples:
                type: array
                items:
                  type: object
                  required:
                    [at, rtt_ms, failures_per_second, race_wins_per_second]
                  properties:
                    at: { type: string, format: date-time }
                    rtt_ms: { type: number }
                    failures_per_second: { type: number }
                    race_wins_per_second: { type: number }
        started_at: { type: [string, "null"], format: date-time }
        restarts: { type: integer }
        filter_index:
          type: [object, "null"]
          required:
            [
              at,
              entries,
              bytes,
              max_bytes,
              build_seconds,
              decision_ns_blocked,
              decision_ns_clean,
              cpu,
            ]
          properties:
            at: { type: string, format: date-time }
            entries: { type: integer, format: int64 }
            bytes: { type: integer, format: int64 }
            max_bytes: { type: integer, format: int64 }
            build_seconds: { type: number }
            decision_ns_blocked: { type: number }
            decision_ns_clean: { type: number }
            cpu: { type: string }
    EngineLogs:
      type: object
      required: [engine_id, lines, last_seq, oldest_seq]
      properties:
        engine_id: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [seq, time, level, message]
            properties:
              seq: { type: integer, format: int64 }
              time: { type: string, format: date-time }
              level: { type: string, enum: [error, warn, info, debug] }
              message: { type: string }
        last_seq: { type: integer, format: int64 }
        oldest_seq: { type: integer, format: int64 }
    FleetSummary:
      type: object
      required:
        [engines_total, engines_by_status, halted_rollouts, engine_groups]
      properties:
        engines_total: { type: integer }
        engines_by_status:
          { type: object, additionalProperties: { type: integer } }
        halted_rollouts: { type: integer }
        engine_groups:
          type: array
          items:
            type: object
            required:
              [id, name, engines, connected, rollout_strategy, rollouts_paused]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              engines: { type: integer }
              connected: { type: integer }
              rollout_strategy: { type: string, enum: [all_at_once, canary] }
              rollouts_paused: { type: boolean }
              stable_version: { type: [integer, "null"], format: int64 }
              active_rollout:
                {
                  oneOf:
                    [
                      { $ref: "#/components/schemas/Rollout" },
                      { type: "null" },
                    ],
                }
    AiAgentName:
      type: string
      enum:
        [
          querylog_anomalies,
          dashboard_insights,
          filter_recommendations,
          upstream_prediction,
          rollout_risk,
          threat_classification,
          capacity_forecast,
          rpz_suggestions,
        ]
    AiAgentState:
      type: object
      required:
        [
          name,
          enabled,
          interval_seconds,
          last_started_at,
          last_finished_at,
          last_outcome,
          last_error,
          next_run_at,
          running,
        ]
      properties:
        name: { $ref: "#/components/schemas/AiAgentName" }
        enabled: { type: boolean }
        interval_seconds: { type: integer, format: int64 }
        last_started_at: { type: [string, "null"], format: date-time }
        last_finished_at: { type: [string, "null"], format: date-time }
        last_outcome: { type: string }
        last_error: { type: string }
        next_run_at: { type: [string, "null"], format: date-time }
        running: { type: boolean }
    AiStatus:
      type: object
      description: The AI layer's state. It never contains the API key.
      required:
        [
          enabled,
          reason,
          model,
          endpoint_host,
          structured_output,
          budget,
          agents,
          features,
          mcp,
        ]
      properties:
        enabled: { type: boolean }
        reason:
          {
            type: string,
            enum:
              [
                "",
                not_configured,
                incomplete_configuration,
                endpoint_not_private,
              ],
          }
        model: { type: string }
        endpoint_host: { type: string }
        structured_output: { type: string }
        budget:
          type: object
          required: [day, limit_tokens, used_tokens, background_limit_tokens]
          properties:
            day: { type: string, format: date }
            limit_tokens: { type: integer, format: int64 }
            used_tokens: { type: integer, format: int64 }
            background_limit_tokens: { type: integer, format: int64 }
        agents:
          { type: array, items: { $ref: "#/components/schemas/AiAgentState" } }
        features:
          type: object
          required: [querylog_search, config_assistant, threat_check]
          properties:
            querylog_search: { type: boolean }
            config_assistant: { type: boolean }
            threat_check: { type: boolean }
        mcp:
          type: object
          required: [enabled, read_only]
          properties:
            enabled: { type: boolean }
            read_only: { type: boolean }
    AiTask:
      type: object
      required:
        [
          id,
          kind,
          status,
          created_at,
          started_at,
          finished_at,
          error_code,
          error_message,
          result,
        ]
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            enum: [querylog_search, threat_check, assistant_message],
          }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        error_code: { type: string }
        error_message: { type: string }
        result:
          type: [object, "null"]
          description: The kind's result (AiQueryLogSearchResult, AiThreatCheckResult or AiAssistantTurnResult) once succeeded.
    AiQueryLogFilters:
      type: object
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        client: { type: string }
        name: { type: string }
        qtype: { type: array, items: { type: string } }
        rcode: { type: array, items: { type: string } }
        cache: { type: array, items: { type: string } }
        filter: { type: array, items: { type: string } }
        category: { type: array, items: { type: string } }
        source: { type: array, items: { type: string } }
        list_id: { type: array, items: { type: string } }
        policy_group: { type: array, items: { type: string } }
        engine_id: { type: array, items: { type: string } }
    AiQueryLogSearchResult:
      type: object
      required: [filters, explanation, summary, suggestions, total_shown]
      properties:
        filters: { $ref: "#/components/schemas/AiQueryLogFilters" }
        explanation: { type: string }
        summary: { type: string }
        suggestions: { type: array, items: { type: string } }
        total_shown: { type: integer }
    AiThreatVerdict:
      type: object
      required:
        [
          name,
          is_threat,
          categories,
          confidence,
          reasoning,
          query_count,
          client_count,
          first_seen,
          last_seen,
          blocked_by,
          cached,
        ]
      properties:
        name: { type: string }
        is_threat: { type: boolean }
        categories: { type: array, items: { type: string } }
        confidence: { type: number }
        reasoning: { type: string }
        query_count: { type: integer, format: int64 }
        client_count: { type: integer, format: int64 }
        first_seen: { type: [string, "null"], format: date-time }
        last_seen: { type: [string, "null"], format: date-time }
        blocked_by: { type: string }
        cached: { type: boolean }
    AiThreatCheckResult:
      type: object
      required: [results]
      properties:
        results:
          {
            type: array,
            items: { $ref: "#/components/schemas/AiThreatVerdict" },
          }
    AiAssistantTurnResult:
      type: object
      required: [message_id, proposal_id]
      properties:
        message_id: { type: integer, format: int64 }
        proposal_id: { type: [string, "null"], format: uuid }
    AiQueryLogSearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    AiThreatCheckRequest:
      type: object
      required: [domains]
      properties:
        domains:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { type: string, minLength: 1, maxLength: 253 },
          }
    AiFinding:
      type: object
      required:
        [
          id,
          kind,
          candidate_id,
          type,
          status,
          severity,
          confidence,
          title,
          description,
          explained,
          detail,
          first_seen,
          last_seen,
          updated_by,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [anomaly, insight] }
        candidate_id: { type: string }
        type: { type: string }
        status:
          { type: string, enum: [open, acknowledged, dismissed, resolved] }
        severity: { type: string, enum: [info, warning, critical] }
        confidence: { type: number }
        title: { type: string }
        description: { type: string }
        explained: { type: boolean }
        detail: { type: object, additionalProperties: true }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    AiFindingUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [acknowledged, dismissed] }
    AiInsights:
      type: object
      required: [insights, summary, score, generated_at]
      properties:
        insights:
          { type: array, items: { $ref: "#/components/schemas/AiFinding" } }
        summary: { type: string }
        score:
          type: integer
          minimum: 0
          maximum: 10
          description: "AI insight health: max(0, 10 - 3 * open critical insights - open warning insights). 10 is healthy; 0 is poor. Not a live availability check."
        generated_at: { type: [string, "null"], format: date-time }
    AiProposalAction:
      type: object
      required: [operation_id, path_params, body, explanation, current]
      properties:
        operation_id: { type: string }
        path_params: { type: object, additionalProperties: { type: string } }
        body: { type: [object, "null"] }
        explanation: { type: string }
        current:
          type: [object, "null"]
          description: The live resource the action changes (getAiProposal only; null in lists and for creations).
    AiProposal:
      type: object
      required:
        [
          id,
          source,
          status,
          title,
          description,
          priority,
          impact,
          evidence,
          actions,
          risk,
          session_id,
          created_at,
          updated_at,
          reviewed_by,
          reviewed_at,
          result,
          dismiss_reason,
        ]
      properties:
        id: { type: string, format: uuid }
        source:
          {
            type: string,
            enum:
              [
                filter_recommendations,
                config_assistant,
                upstream_prediction,
                rollout_risk,
                capacity_forecast,
                rpz_suggestions,
              ],
          }
        status:
          {
            type: string,
            enum: [open, applied, failed, stale, dismissed, superseded],
          }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        impact: { type: object, additionalProperties: true }
        evidence: { type: object, additionalProperties: true }
        actions:
          {
            type: array,
            items: { $ref: "#/components/schemas/AiProposalAction" },
          }
        risk: { type: object, additionalProperties: true }
        session_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_by: { type: string }
        reviewed_at: { type: [string, "null"], format: date-time }
        result: { type: [object, "null"] }
        dismiss_reason: { type: string }
    AiApplyRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { type: string, format: uuid },
          }
        acknowledge_license: { type: boolean, default: false }
    AiApplyResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, status, actions]
            properties:
              id: { type: string, format: uuid }
              status: { type: string }
              actions:
                type: array
                items:
                  type: object
                  required: [operation_id, http_status, code, message]
                  properties:
                    operation_id: { type: string }
                    http_status: { type: integer }
                    code: { type: string }
                    message: { type: string }
    AiDismissRequest:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { type: string, format: uuid },
          }
        reason: { type: string, maxLength: 500 }
    AiDismissResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, status, code]
            properties:
              id: { type: string, format: uuid }
              status: { type: string }
              code: { type: string }
    AiAssistantMessage:
      type: object
      required: [id, role, content, proposal_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        proposal_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    AiAssistantMessageInput:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    AiAssistantSession:
      type: object
      required: [id, title, created_at, updated_at, messages, proposal, task]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        messages:
          {
            type: array,
            items: { $ref: "#/components/schemas/AiAssistantMessage" },
          }
        proposal:
          {
            oneOf:
              [{ $ref: "#/components/schemas/AiProposal" }, { type: "null" }],
          }
        task:
          { oneOf: [{ $ref: "#/components/schemas/AiTask" }, { type: "null" }] }
    AiUpstreamPrediction:
      type: object
      required:
        [
          upstream_id,
          upstream_name,
          trend,
          confidence,
          current_rtt_p50_ms,
          current_rtt_p99_ms,
          slope_ms_per_hour,
          step_change,
          periodic_hours,
          projected_time_to_threshold,
          data_points_analyzed,
          reasoning,
          recommendation,
        ]
      properties:
        upstream_id: { type: string }
        upstream_name: { type: string }
        trend:
          {
            type: string,
            enum:
              [
                stable,
                degrading,
                improving,
                periodic,
                failing,
                insufficient_data,
              ],
          }
        confidence: { type: number }
        current_rtt_p50_ms: { type: number }
        current_rtt_p99_ms: { type: number }
        slope_ms_per_hour: { type: number }
        step_change: { type: boolean }
        periodic_hours: { type: array, items: { type: integer } }
        projected_time_to_threshold:
          { type: [string, "null"], format: date-time }
        data_points_analyzed: { type: integer }
        reasoning: { type: string }
        recommendation:
          type: object
          required: [type, description]
          properties:
            type:
              { type: string, enum: [switch_strategy, reorder, disable, none] }
            description: { type: string }
    AiCapacityForecast:
      type: object
      required:
        [
          resource,
          current_value,
          max_value,
          growth_per_day,
          growth_per_week,
          projected_exhaustion_date,
          days_remaining,
          trend,
          confidence,
          recommendation,
          points_analyzed,
        ]
      properties:
        resource:
          {
            type: string,
            enum:
              [
                filter_index,
                cache,
                recursor_cache,
                engine_memory,
                blocklist_entries,
                query_volume,
              ],
          }
        current_value: { type: number }
        max_value: { type: [number, "null"] }
        growth_per_day: { type: number }
        growth_per_week: { type: number }
        projected_exhaustion_date: { type: [string, "null"], format: date-time }
        days_remaining: { type: [integer, "null"] }
        trend:
          {
            type: string,
            enum: [stable, growing, shrinking, insufficient_data],
          }
        confidence: { type: number }
        recommendation: { type: string }
        points_analyzed: { type: integer }
    AiForecast:
      type: object
      required:
        [
          id,
          kind,
          subject,
          generated_at,
          valid_until,
          proposal_id,
          upstream,
          capacity,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [upstream, capacity] }
        subject: { type: string }
        generated_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        proposal_id: { type: [string, "null"], format: uuid }
        upstream:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/AiUpstreamPrediction" },
                { type: "null" },
              ],
          }
        capacity:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/AiCapacityForecast" },
                { type: "null" },
              ],
          }
    AiRolloutRisk:
      type: object
      required:
        [
          rollout_id,
          status,
          risk_score,
          risk_level,
          analysis,
          historical_patterns,
          recommendation,
          proposal_id,
          assessed_at,
          error,
        ]
      properties:
        rollout_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, assessed, failed, skipped] }
        risk_score: { type: [integer, "null"], minimum: 1, maximum: 10 }
        risk_level: { type: [string, "null"], enum: [low, medium, high] }
        analysis: { type: string }
        historical_patterns:
          type: array
          items:
            type: object
            required:
              [
                config_version,
                description,
                outcome,
                canary_rejected,
                max_servfail_ratio,
              ]
            properties:
              config_version: { type: integer, format: int64 }
              description: { type: string }
              outcome: { type: string }
              canary_rejected: { type: boolean }
              max_servfail_ratio: { type: number }
        recommendation:
          type: [object, "null"]
          required:
            [
              strategy,
              canary_count,
              min_health_queries,
              max_servfail_ratio,
              reasoning,
            ]
          properties:
            strategy: { type: string }
            canary_count: { type: integer }
            min_health_queries: { type: integer }
            max_servfail_ratio: { type: number }
            reasoning: { type: string }
        proposal_id: { type: [string, "null"], format: uuid }
        assessed_at: { type: [string, "null"], format: date-time }
        error: { type: string }
    AiListClassification:
      type: object
      required:
        [
          list_id,
          blob_sha256,
          sample_size,
          entry_count,
          classified_at,
          breakdown,
        ]
      properties:
        list_id: { type: string, format: uuid }
        blob_sha256: { type: string }
        sample_size: { type: integer }
        entry_count: { type: integer, format: int64 }
        classified_at: { type: [string, "null"], format: date-time }
        breakdown:
          type: array
          items:
            type: object
            required: [category, sampled, estimated]
            properties:
              category: { type: string }
              sampled: { type: integer }
              estimated: { type: integer, format: int64 }
paths:
  /health:
    get:
      {
        operationId: getHealth,
        security: [],
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Health" } },
                  },
              },
            "503":
              {
                description: degraded,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Health" } },
                  },
              },
          },
      }
  /version:
    get:
      operationId: getVersion
      responses:
        "200":
          {
            description: ok,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/VersionInfo" } },
              },
          }
  /setup:
    get:
      {
        operationId: getSetupStatus,
        security: [],
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/SetupStatus" } },
                  },
              },
          },
      }
    post:
      operationId: completeSetup
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/SetupRequest" } },
            },
        }
      responses:
        {
          "201":
            {
              description: created; sets the session cookie,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/User" } },
                },
            },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LoginRequest" } },
            },
        }
      responses:
        {
          "200":
            {
              description: logged in; sets the session cookie,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/User" } },
                },
            },
          "401": { $ref: "#/components/responses/Error" },
        }
  /auth/logout:
    post:
      { operationId: logout, responses: { "204": { description: logged out } } }
  /auth/me:
    get:
      {
        operationId: getCurrentUser,
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/User" } },
                  },
              },
            "401": { $ref: "#/components/responses/Error" },
          },
      }
    put:
      operationId: updateCurrentUser
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CurrentUserUpdate" } },
            },
        }
      responses:
        "200":
          {
            description: ok,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/User" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/me/password:
    post:
      operationId: changeOwnPassword
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PasswordChange" } },
            },
        }
      responses:
        "204": { description: password changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/providers:
    get:
      {
        operationId: listAuthProviders,
        security: [],
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      {
                        schema: { $ref: "#/components/schemas/AuthProviders" },
                      },
                  },
              },
          },
      }
  /auth/oidc/start:
    get:
      operationId: startOidcLogin
      security: []
      parameters: [{ name: return_to, in: query, schema: { type: string } }]
      responses:
        {
          "302": { description: redirect to the identity provider },
          "503": { $ref: "#/components/responses/Error" },
        }
  /auth/oidc/callback:
    get:
      operationId: oidcCallback
      security: []
      parameters:
        [
          { name: state, in: query, required: true, schema: { type: string } },
          { name: code, in: query, required: true, schema: { type: string } },
        ]
      responses:
        {
          "302":
            { description: redirect into the GUI with the session cookie set },
          "401": { $ref: "#/components/responses/Error" },
        }
  /dashboard:
    get:
      {
        operationId: getDashboard,
        responses:
          {
            "200":
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Dashboard" } },
                  },
              },
          },
      }
  /dashboard/series:
    get:
      operationId: getDashboardSeries
      parameters:
        - {
            name: range,
            in: query,
            required: true,
            schema: { type: string, enum: [15m, 1h, 6h, 24h, 7d] },
          }
      responses:
        "200":
          {
            description: ok,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/DashboardSeries" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
  /dashboard/top:
    get:
      operationId: getDashboardTop
      parameters:
        - {
            name: range,
            in: query,
            required: true,
            schema: { type: string, enum: [15m, 1h, 6h, 24h, 7d] },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 10 },
          }
      responses:
        "200":
          {
            description: ok,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/DashboardTop" } },
              },
          }
        "400": { $ref: "#/components/responses/Error" }
  /dashboard/health:
    get:
      operationId: getDashboardHealth
      responses:
        "200":
          {
            description: ok,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/DashboardHealth" } },
              },
          }
  /upstreams:
    get:
      {
