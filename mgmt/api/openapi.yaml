openapi: 3.1.0
info: { title: Nexora management API, version: 1.0.0 }
servers: [{ url: /api/v1 }]
security: [{ session: [] }, { bearer: [] }]
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: nexora_session }
    bearer: { type: http, scheme: bearer }
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    Revision:
      {
        name: revision,
        in: query,
        required: true,
        schema: { type: integer, format: int64 },
      }
  responses:
    Error:
      {
        description: error,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          description: 'Per-line problems of submitted zone data; for license_acknowledgement_required one entry per source (line 0, message "<source key>: <notice>").'
          items:
            type: object
            required: [line, message]
            properties:
              line: { type: integer }
              message: { type: string }
    Health:
      type: object
      required: [status, database, version]
      properties:
        {
          status: { type: string, enum: [ok, degraded] },
          database: { type: string, enum: [ok, unavailable] },
          version: { type: string },
        }
    SetupStatus:
      {
        type: object,
        required: [required],
        properties: { required: { type: boolean } },
      }
    SetupRequest:
      type: object
      required: [token, username, email, password]
      properties:
        {
          token: { type: string },
          username: { type: string },
          email: { type: string },
          password: { type: string, minLength: 12 },
        }
    LoginRequest:
      type: object
      required: [username, password]
      properties: { username: { type: string }, password: { type: string } }
    AuthProviders:
      {
        type: object,
        required: [local, oidc],
        properties: { local: { type: boolean }, oidc: { type: boolean } },
      }
    Role: { type: string, enum: [viewer, operator, admin] }
    User:
      type: object
      required:
        [
          id,
          username,
          email,
          role,
          source,
          disabled,
          revision,
          created_at,
          display_name,
          last_login_at,
          preferences,
        ]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        source: { type: string, enum: [local, oidc, system] }
        disabled: { type: boolean }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        display_name: { type: string }
        last_login_at: { type: [string, "null"], format: date-time }
        preferences: { $ref: "#/components/schemas/UserPreferences" }
    UserPreferences:
      type: object
      required: [theme, time_zone, clock_24h, querylog_live]
      properties:
        theme: { type: string, enum: [system, light, dark] }
        time_zone:
          {
            type: string,
            maxLength: 64,
            description: "IANA name; empty uses the browser",
          }
        clock_24h: { type: boolean }
        querylog_live: { type: boolean }
    CurrentUserUpdate:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64 }
        email: { type: string }
        display_name: { type: string, maxLength: 64 }
        preferences: { $ref: "#/components/schemas/UserPreferences" }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12 }
        revoke_other_sessions: { type: boolean, default: true }
    VersionInfo:
      type: object
      required: [version, commit, build_date, repository_url, engines]
      properties:
        version: { type: string }
        commit: { type: string }
        build_date: { type: string }
        repository_url: { type: string }
        engines:
          type: array
          items:
            type: object
            required: [version, count]
            properties:
              version: { type: string }
              count: { type: integer }
    UserCreate:
      type: object
      required: [username, email, password, role]
      properties:
        {
          username: { type: string },
          email: { type: string },
          password: { type: string, minLength: 12 },
          role: { $ref: "#/components/schemas/Role" },
        }
    UserUpdate:
      type: object
      required: [revision, email, role, disabled]
      properties:
        {
          revision: { type: integer, format: int64 },
          email: { type: string },
          role: { $ref: "#/components/schemas/Role" },
          disabled: { type: boolean },
          password: { type: string, minLength: 12 },
        }
    Upstream:
      type: object
      required:
        [
          id,
          name,
          protocol,
          address,
          tls_server_name,
          doh_url,
          timeout_ms,
          ca_certificate_pem,
          position,
          enabled,
          revision,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        protocol: { type: string, enum: [udp, tcp, dot, doh] }
        address: { type: string }
        tls_server_name: { type: string }
        doh_url: { type: string }
        timeout_ms: { type: integer, minimum: 50, maximum: 5000 }
        ca_certificate_pem: { type: string }
        position: { type: integer }
        enabled: { type: boolean }
        revision: { type: integer, format: int64 }
    UpstreamInput:
      type: object
      required: [name, protocol, timeout_ms, enabled, position]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name: { type: string, minLength: 1, maxLength: 64 }
        protocol: { type: string, enum: [udp, tcp, dot, doh] }
        address: { type: string }
        tls_server_name: { type: string }
        doh_url: { type: string }
        timeout_ms: { type: integer, minimum: 50, maximum: 5000 }
        ca_certificate_pem: { type: string }
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        revision:
          { type: integer, format: int64, description: required on update }
    ResolverSettings:
      type: object
      required:
        [
          strategy,
          cache_max_bytes,
          cache_min_ttl,
          cache_max_ttl,
          cache_negative_max_ttl,
          cache_stale_window,
          block_mode,
          block_ttl,
          otlp_endpoint,
          trace_sample_one_in,
          trace_slow_threshold_us,
          revision,
        ]
      properties:
        strategy: { type: string, enum: [ordered, fastest, parallel] }
        parallel_max:
          {
            type: integer,
            minimum: 0,
            maximum: 8,
            description: "parallel strategy: upstreams queried at once; 0 = every candidate, engines cap at 8",
          }
        cache_max_bytes: { type: integer, format: int64, minimum: 1048576 }
        cache_min_ttl: { type: integer, minimum: 0 }
        cache_max_ttl: { type: integer, minimum: 0 }
        cache_negative_max_ttl: { type: integer, minimum: 0 }
        cache_stale_window: { type: integer, minimum: 0 }
        block_mode: { type: string, enum: [null_ip, nxdomain, refused] }
        block_ttl: { type: integer, minimum: 0 }
        otlp_endpoint: { type: string }
        trace_sample_one_in: { type: integer, minimum: 0 }
        trace_slow_threshold_us: { type: integer, minimum: 0 }
        revision: { type: integer, format: int64 }
    AccessControl:
      type: object
      required: [allow_cidrs, revision]
      properties:
        {
          allow_cidrs: { type: array, items: { type: string } },
          authoritative_allow_cidrs:
            {
              type: array,
              items: { type: string },
              description: "Clients allowed to query hosted zones that set no allow_query_cidrs; omitted on update keeps the current value.",
            },
          revision: { type: integer, format: int64 },
        }
    FilterList:
      type: object
      required:
        [
          id,
          name,
          kind,
          url,
          refresh_interval_seconds,
          enabled,
          entry_count,
          invalid_line_count,
          last_error,
          stale,
          revision,
          engine_group_id,
          category_key,
          managed_by_catalog,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        category_key:
          {
            type: [string, "null"],
            description: "filter category of a catalog-managed list; null for custom lists",
          }
        managed_by_catalog:
          {
            type: boolean,
            description: "mirrors a filter category catalog source; read-only (toggle it through /filter-categories)",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [block, allow] }
        url: { type: string }
        refresh_interval_seconds: { type: integer, minimum: 300 }
        enabled: { type: boolean }
        current_blob_sha256: { type: [string, "null"] }
        entry_count: { type: integer }
        invalid_line_count: { type: integer }
        last_success_at: { type: [string, "null"], format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        stale:
          {
            type: boolean,
            description: last attempt failed or last success older than 2 x refresh interval,
          }
        revision: { type: integer, format: int64 }
    FilterListInput:
      type: object
      required: [name, kind, url, refresh_interval_seconds, enabled]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [block, allow] }
        url: { type: string, pattern: "^https?://" }
        refresh_interval_seconds: { type: integer, minimum: 300 }
        enabled: { type: boolean }
        revision: { type: integer, format: int64 }
    FilterCategorySource:
      type: object
      required:
        [
          key,
          name,
          url,
          format,
          archive_member,
          license,
          license_url,
          attribution,
          commercial_use,
          notice,
          enabled,
          list_id,
          entry_count,
          last_success_at,
          last_error,
          stale,
        ]
      properties:
        key: { type: string }
        name: { type: string }
        url: { type: string }
        format: { type: string, enum: [domains, hosts, wildcard] }
        archive_member:
          {
            type: string,
            description: "member of a .tar.gz archive; empty for plain lists",
          }
        license: { type: string }
        license_url: { type: string }
        attribution: { type: string }
        commercial_use:
          {
            type: boolean,
            description: "false: enabling needs acknowledge_license",
          }
        notice: { type: string }
        enabled: { type: boolean }
        list_id: { type: string, format: uuid }
        entry_count: { type: integer }
        last_success_at: { type: [string, "null"], format: date-time }
        last_error: { type: string }
        stale: { type: boolean }
    FilterCategory:
      type: object
      required: [key, name, description, enabled, stale, revision, sources]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        stale:
          {
            type: boolean,
            description: "an enabled source failed its last refresh or is older than two intervals",
          }
        revision: { type: integer, format: int64 }
        sources:
          {
            type: array,
            items: { $ref: "#/components/schemas/FilterCategorySource" },
          }
    FilterCategoryUpdate:
      type: object
      additionalProperties: false
      required: [enabled, revision]
      properties:
        enabled: { type: boolean }
        revision: { type: integer, format: int64 }
        acknowledge_license: { type: boolean, default: false }
        sources:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [key, enabled]
            properties:
              key: { type: string }
              enabled: { type: boolean }
    Allowlist:
      type: object
      required: [domains, revision]
      properties:
        {
          domains: { type: array, items: { type: string } },
          revision: { type: integer, format: int64 },
        }
    Engine:
      type: object
      required:
        [
          id,
          node_name,
          engine_version,
          enrolled_at,
          connected,
          applied_version,
          rejected_reason,
          persist_error,
          version_ahead,
          status,
          engine_group_id,
          engine_group_name,
          labels,
          revision,
          target_version,
          certificate_serial,
        ]
      properties:
        id: { type: string, format: uuid }
        node_name: { type: string }
        engine_version: { type: string }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        connected: { type: boolean }
        applied_version: { type: integer, format: int64 }
        rejected_version: { type: [integer, "null"], format: int64 }
        rejected_reason: { type: string }
        persist_error: { type: string }
        version_ahead: { type: boolean }
        status:
          {
            type: string,
            enum: [current, behind, rejected, ahead, disconnected, revoked],
          }
        engine_group_id: { type: string, format: uuid }
        engine_group_name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        revision: { type: integer, format: int64 }
        target_version: { type: integer, format: int64 }
        certificate_serial: { type: string }
        revoked_at: { type: [string, "null"], format: date-time }
        cert_rotate_requested_at: { type: [string, "null"], format: date-time }
        certificate_not_after: { type: [string, "null"], format: date-time }
    JoinToken:
      type: object
      required:
        [
          id,
          name,
          created_by,
          created_at,
          expires_at,
          uses,
          engine_group_id,
          engine_group_name,
          labels,
          state,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        uses: { type: integer }
        engine_group_id: { type: string, format: uuid }
        engine_group_name: { type: string }
        labels: { type: object, additionalProperties: { type: string } }
        state: { type: string, enum: [active, expired, exhausted, revoked] }
        max_uses: { type: [integer, "null"] }
    JoinTokenCreate:
      type: object
      required: [name, ttl_seconds]
      properties:
        name: { type: string }
        ttl_seconds: { type: integer, minimum: 60, maximum: 31536000 }
        engine_group_id: { type: string, format: uuid }
        max_uses: { type: integer, minimum: 1, maximum: 100000 }
        labels:
          {
            type: object,
            additionalProperties: { type: string, maxLength: 63 },
            maxProperties: 32,
          }
    JoinTokenCreated:
      type: object
      required: [join_token, token]
      properties:
        {
          join_token: { $ref: "#/components/schemas/JoinToken" },
          token: { type: string },
        }
    ConfigVersion:
      type: object
      required: [version, created_at, created_by, summary]
      properties:
        {
          version: { type: integer, format: int64 },
          created_at: { type: string, format: date-time },
          created_by: { type: string },
          summary: { type: string },
        }
    ApiToken:
      type: object
      required: [id, user_id, name, prefix, role, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    ApiTokenCreate:
      type: object
      required: [name, role]
      properties:
        {
          name: { type: string },
          role: { $ref: "#/components/schemas/Role" },
          expires_at: { type: [string, "null"], format: date-time },
        }
    ApiTokenCreated:
      type: object
      required: [api_token, token]
      properties:
        {
          api_token: { $ref: "#/components/schemas/ApiToken" },
          token: { type: string },
        }
    AuditEvent:
      type: object
      required:
        [
          id,
          at,
          actor_type,
          actor_id,
          actor_name,
          action,
          target_type,
          target_id,
          diff,
        ]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, api_token, system] }
        actor_id: { type: string }
        actor_name: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        diff: { type: object, additionalProperties: true }
        config_version: { type: [integer, "null"], format: int64 }
    QueryLogRecord:
      type: object
      required:
        [
          time,
          client,
          name,
          qtype,
          rcode,
          cache,
          filter,
          upstream,
          transport,
          engine_id,
          duration_us,
          list_id,
          category,
          source,
          list_name,
          rule,
          policy_group_id,
          policy_group_name,
          rpz_zone_id,
          rpz_zone_name,
          rpz_action,
          rewrite_answer,
          upstreams_raced,
          threat,
        ]
      properties:
        time: { type: string, format: date-time }
        client: { type: string }
        name: { type: string }
        qtype: { type: string }
        rcode: { type: string }
        cache: { type: string, enum: [hit, miss, stale, none, auth] }
        filter: { type: string, enum: [none, blocked, allowed, rewritten] }
        upstream: { type: string }
        transport: { type: string }
        engine_id: { type: string }
        duration_us: { type: integer, format: int64 }
        list_id: { type: string }
        category: { type: string }
        source:
          {
            type: string,
            enum: ["", blocklist, category, allowlist, rpz, rewrite, acl],
          }
        list_name: { type: string }
        rule: { type: string }
        policy_group_id: { type: string }
        policy_group_name: { type: string }
        rpz_zone_id: { type: string }
        rpz_zone_name: { type: string }
        rpz_action: { type: string }
        rewrite_answer: { type: string }
        upstreams_raced: { type: integer }
        threat:
          type: [object, "null"]
          description: The cached AI threat verdict for the name; null when none is cached or AI is off.
          required: [is_threat, categories, confidence, checked_at]
          properties:
            is_threat: { type: boolean }
            categories: { type: array, items: { type: string } }
            confidence: { type: number }
            checked_at: { type: string, format: date-time }
    QueryLogPage:
      type: object
      required: [backend, records, next_cursor]
      properties:
        {
          backend:
            {
              type: string,
              description: "builtin, opensearch, clickhouse or loki",
            },
          records:
            {
              type: array,
              items: { $ref: "#/components/schemas/QueryLogRecord" },
            },
          next_cursor: { type: string },
        }
    Dashboard:
      type: object
      required:
        [
          queries_total,
          blocked_total,
          qps,
          cache_hit_ratio,
          engines_total,
          engines_connected,
          upstreams,
          series,
        ]
      properties:
        queries_total: { type: integer, format: int64 }
        blocked_total: { type: integer, format: int64 }
        qps: { type: number }
        cache_hit_ratio: { type: number }
        engines_total: { type: integer }
        engines_connected: { type: integer }
        upstreams:
          type: array
          items:
            type: object
            required:
              - name
              - up_engines
              - unmeasured_engines
              - total_engines
              - rtt_ms
            properties:
              name: { type: string }
              up_engines:
                type: integer
                description: Engines reporting up with a successful RTT sample.
              unmeasured_engines:
                type: integer
                description: Engines not marked down but without a successful RTT sample.
              total_engines: { type: integer }
              rtt_ms: { type: number }
        series:
          type: array
          items:
            {
              type: object,
              required: [at, qps],
              properties:
                {
                  at: { type: string, format: date-time },
                  qps: { type: number },
                },
            }
    SafeSearch:
      type: object
      required: [google, bing, duckduckgo, youtube]
      properties:
        google: { type: boolean }
        bing: { type: boolean }
        duckduckgo: { type: boolean }
        youtube: { type: string, enum: ["off", moderate, strict] }
    GlobalSafeSearch:
      allOf:
        - { $ref: "#/components/schemas/SafeSearch" }
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, format: int64 }
    PolicyGroupInput:
      type: object
      required: [name, cidrs]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9 _.-]{0,62}$" }
        description: { type: string, maxLength: 500, default: "" }
        cidrs:
          { type: array, minItems: 1, maxItems: 1024, items: { type: string } }
        filter_list_ids:
          {
            type: array,
            maxItems: 256,
            items: { type: string, format: uuid },
            default: [],
          }
        allowlist:
          { type: array, maxItems: 10000, items: { type: string }, default: [] }
        category_keys:
          {
            type: array,
            maxItems: 64,
            items: { type: string },
            default: [],
            description: "filter categories whose enabled catalog sources this group blocks",
          }
        acknowledge_license:
          {
            type: boolean,
            default: false,
            description: "required when a newly selected category has enabled sources that are not free for commercial use",
          }
        safe_search: { $ref: "#/components/schemas/SafeSearch" }
    PolicyGroupUpdate:
      allOf:
        - { $ref: "#/components/schemas/PolicyGroupInput" }
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, format: int64 }
    PolicyGroup:
      type: object
      required:
        [
          id,
          name,
          description,
          cidrs,
          filter_list_ids,
          allowlist,
          category_keys,
          safe_search,
          revision,
          created_at,
          updated_at,
          engine_group_id,
        ]
      properties:
        engine_group_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "engine group; null applies to every group",
          }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        cidrs: { type: array, items: { type: string } }
        filter_list_ids: { type: array, items: { type: string, format: uuid } }
        allowlist: { type: array, items: { type: string } }
        category_keys: { type: array, items: { type: string } }
        safe_search: { $ref: "#/components/schemas/SafeSearch" }
        revision: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
