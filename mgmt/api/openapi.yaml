  /query-log:
    get:
      operationId: searchQueryLog
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: client, in: query, schema: { type: string } }
        - {
            name: name,
            in: query,
            description: "Case-insensitive substring of the query name; a trailing dot is ignored.",
            schema: { type: string },
          }
        - {
            name: qtype,
            in: query,
            style: form,
            explode: true,
            schema: { type: array, maxItems: 32, items: { type: string } },
          }
        - {
            name: rcode,
            in: query,
            style: form,
            explode: true,
            schema: { type: array, maxItems: 32, items: { type: string } },
          }
        - {
            name: cache,
            in: query,
            style: form,
            explode: true,
            schema:
              {
                type: array,
                maxItems: 32,
                items: { type: string, enum: [hit, miss, stale, none, auth] },
              },
          }
        - {
            name: filter,
            in: query,
            style: form,
            explode: true,
            schema:
              {
                type: array,
                maxItems: 32,
                items:
                  { type: string, enum: [none, blocked, allowed, rewritten] },
              },
          }
        - {
            name: category,
            in: query,
            style: form,
            explode: true,
            schema: { type: array, maxItems: 32, items: { type: string } },
          }
        - {
            name: source,
            in: query,
            style: form,
            explode: true,
            schema:
              {
                type: array,
                maxItems: 32,
                items:
                  {
                    type: string,
                    enum: [blocklist, category, allowlist, rpz, rewrite, acl],
                  },
              },
          }
        - {
            name: list_id,
            in: query,
            style: form,
            explode: true,
            schema: { type: array, maxItems: 32, items: { type: string } },
          }
        - {
            name: policy_group,
            in: query,
            style: form,
            explode: true,
            schema:
              {
                type: array,
                maxItems: 32,
                items:
                  {
                    type: string,
                    description: "A policy group UUID or global",
                  },
              },
          }
        - {
            name: engine_id,
            in: query,
            style: form,
            explode: true,
            schema: { type: array, maxItems: 32, items: { type: string } },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 1000, default: 100 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        {
          "200":
            {
              description: ok,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/QueryLogPage" } },
                },
            },
          "400": { $ref: "#/components/responses/Error" },
          "503": { $ref: "#/components/responses/Error" },
        }
