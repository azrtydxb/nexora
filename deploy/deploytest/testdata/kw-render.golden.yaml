# Source: nexora/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexora
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nexora
    app.kubernetes.io/instance: nexora
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "golden"
    helm.sh/chart: nexora-1.0.0
    release: kps
spec:
  groups:
    - name: nexora-fleet
      rules:
        - alert: NexoraEngineDisconnected
          expr: max(nexora_mgmt_engines_disconnected{namespace="nexora"}) > 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} Nexora engine(s) without a control stream for more than 60 seconds"
        - alert: NexoraRolloutHalted
          expr: max(nexora_mgmt_rollouts{state="halted",namespace="nexora"}) > 0
          labels: { severity: warning }
          annotations:
            summary: A Nexora configuration rollout halted on its health gate; roll back or fix forward
        - alert: NexoraManagementPlaneDown
          expr: absent(up{namespace="nexora",service="nexora-mgmt"} == 1)
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No Nexora management plane instance is being scraped

