# Source: nexora/templates/mgmt-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora
  labels:
    app.kubernetes.io/name: nexora-mgmt
    app.kubernetes.io/instance: nexora
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "golden"
    helm.sh/chart: nexora-1.0.0
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    # Plain HTTP redirects to HTTPS; session cookies are Secure.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["nexora.kw.local"]
      secretName: nexora-ingress-tls
  rules:
    - host: "nexora.kw.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-mgmt
                port: { name: http }

