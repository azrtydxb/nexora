apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-engine
  labels:
    app.kubernetes.io/name: nexora-engine
    app.kubernetes.io/instance: nexora
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "golden"
    helm.sh/chart: nexora-1.0.0
    nexora.io/engine-group: default
data:
  engine.toml: |
    node_name = "engine"
    state_dir = "/var/lib/nexora"
    management_urls = ["https://nexora-mgmt-grpc.nexora.svc.cluster.local:9443"]
    join_token_file = "/etc/nexora/join/join-token"
    listen_udp = ["0.0.0.0:53"]
    listen_tcp = ["0.0.0.0:53"]
    listen_dot = ["0.0.0.0:853"]
    listen_doh = ["0.0.0.0:443"]
    doh_path = "/dns-query"
    listen_doq = ["0.0.0.0:853"]
    metrics_listen = "0.0.0.0:9153"
    workers = 2
    shutdown_drain_seconds = 15

