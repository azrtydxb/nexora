# Source: nexora/templates/mgmt-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-mgmt
  labels:
    app.kubernetes.io/name: nexora-mgmt
    app.kubernetes.io/instance: nexora
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "golden"
    helm.sh/chart: nexora-1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-mgmt
      app.kubernetes.io/instance: nexora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-mgmt
        app.kubernetes.io/instance: nexora
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "golden"
        helm.sh/chart: nexora-1.0.0
    spec:
      # runAsGroup and fsGroup make the 0440 secret volumes (CA, KEK, DNS TLS) readable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nexora-mgmt
                    app.kubernetes.io/instance: nexora
      initContainers:
        - name: migrate
          image: 192.168.10.131/azrtydxb/nexora-mgmt:golden
          imagePullPolicy: Always
          args: ["migrate"]
          env:
            - name: NEXORA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexora-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: mgmt
          image: 192.168.10.131/azrtydxb/nexora-mgmt:golden
          imagePullPolicy: Always
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9443 }
          env:
            - { name: NEXORA_HTTP_LISTEN, value: ":8080" }
            - { name: NEXORA_GRPC_LISTEN, value: ":9443" }
            - name: NEXORA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nexora-db-app
                  key: uri
            - { name: NEXORA_CA_CERT_FILE, value: /etc/nexora/ca/ca.crt }
            - { name: NEXORA_CA_KEY_FILE, value: /etc/nexora/ca/ca.key }
            - name: NEXORA_GRPC_SERVER_NAMES
              value: "nexora-mgmt-grpc,nexora-mgmt-grpc.nexora.svc,nexora-mgmt-grpc.nexora.svc.cluster.local,192.168.10.135"
            - name: NEXORA_PUBLIC_URL
              value: "https://nexora.kw.local"
            - name: NEXORA_SECURE_COOKIES
              value: "true"
            - name: NEXORA_ENGINE_CERT_TTL
              value: "2160h"
            - name: NEXORA_ROLLOUT_TICK
              value: "1s"
            - name: NEXORA_QUERYLOG_BACKEND
              value: "opensearch"
            - name: NEXORA_QUERYLOG_BUILTIN_CAPACITY
              value: "200000"
            - name: NEXORA_OPENSEARCH_URL
              value: "http://opensearch.nexora.svc.cluster.local:9200"
            - name: NEXORA_OPENSEARCH_INDEX
              value: "nexora-querylog-*"
            - name: NEXORA_OTLP_ENDPOINT
              value: "http://nexora-otelcol.nexora.svc.cluster.local:4317"
            # 32 random bytes (base64) sealing stored secrets such as TSIG keys.
            - { name: NEXORA_KEK_FILE, value: /etc/nexora/kek/kek }
            # The kubelet updates Secret volumes in place, so rotating the Secret rotates the DNS
            # serving certificate without restarts.
            - { name: NEXORA_DNS_TLS_CERT_FILE, value: /etc/nexora/dns-tls/tls.crt }
            - { name: NEXORA_DNS_TLS_KEY_FILE, value: /etc/nexora/dns-tls/tls.key }
            - name: NEXORA_DNS_TLS_RELOAD_INTERVAL
              value: "30s"
            - name: NEXORA_TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/16
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: ca, mountPath: /etc/nexora/ca, readOnly: true }
            - { name: kek, mountPath: /etc/nexora/kek, readOnly: true }
            - { name: dns-tls, mountPath: /etc/nexora/dns-tls, readOnly: true }
      volumes:
        - name: ca
          secret:
            secretName: nexora-ca
            defaultMode: 0440
        - name: kek
          secret: { secretName: nexora-kek, defaultMode: 0440 }
        - name: dns-tls
          secret: { secretName: nexora-dns-tls, defaultMode: 0440 }

