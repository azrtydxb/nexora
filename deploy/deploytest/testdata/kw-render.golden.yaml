# Source: nexora/templates/engine-workloads.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nexora-engine-a
  labels:
    app.kubernetes.io/name: nexora-engine
    app.kubernetes.io/instance: nexora
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "golden"
    helm.sh/chart: nexora-1.0.0
    nexora.io/engine-group: default
    nexora.io/engine-instance: a
spec:
  # Zero-downtime updates: the new engine starts beside the old one (same node for a DaemonSet,
  # sharing its hostPath state directory, which the engine supports), and the old one is only
  # stopped once the new one is ready (/ready: configuration applied) and stayed ready for
  # minReadySeconds. hostNetwork engines cannot run twice on a node (same host ports), so they
  # are replaced one at a time instead.
  minReadySeconds: 5
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-engine
      app.kubernetes.io/instance: nexora
      nexora.io/engine-group: default
      nexora.io/engine-instance: a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-engine
        app.kubernetes.io/instance: nexora
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "golden"
        helm.sh/chart: nexora-1.0.0
        nexora.io/engine-group: default
        nexora.io/engine-instance: a
      annotations:
        checksum/config: 0fd93c8aa8c37dd0fe2c13ca709fae2ff56a06fb2d8fb094541c5af5852b8e5d
    spec:
      # The engine drains for shutdownDrainSeconds after SIGTERM, then finishes in-flight queries
      # (at most 5 s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        # Port 53 without NET_BIND_SERVICE (a namespaced sysctl, unavailable with hostNetwork).
        sysctls: [{ name: net.ipv4.ip_unprivileged_port_start, value: "0" }]
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - master-12
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
      initContainers:
        # The hostPath directory is created root-owned; hand it to the engine user.
        - name: state-owner
          image: 192.168.10.131/library/busybox:1.37
          imagePullPolicy: Always
          command: ["sh", "-c", "chown 10001:10001 /var/lib/nexora && chmod 0700 /var/lib/nexora"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [CHOWN, FOWNER] }
          volumeMounts:
            - { name: state, mountPath: /var/lib/nexora }
      containers:
        - name: engine
          image: 192.168.10.131/azrtydxb/nexora-engine:golden
          imagePullPolicy: Always
          args: ["--config", "/etc/nexora/engine.toml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # A stable name per node and group, so a restarted pod keeps its engine identity.
            - name: NEXORA_ENGINE_NODE_NAME
              value: "$(K8S_NODE_NAME)"
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: dot, containerPort: 853, protocol: TCP }
            - { name: doq, containerPort: 853, protocol: UDP }
            - { name: doh, containerPort: 443, protocol: TCP }
            - { name: metrics, containerPort: 9153, protocol: TCP }
          # Ready only with an applied configuration (filter index built) and until shutdown starts.
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 1
            failureThreshold: 1
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            httpGet: { path: /live, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            limits:
              cpu: "4"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/nexora/engine.toml, subPath: engine.toml, readOnly: true }
            - { name: join, mountPath: /etc/nexora/join, readOnly: true }
            - { name: state, mountPath: /var/lib/nexora }
      volumes:
        - name: config
          configMap: { name: nexora-engine }
        - name: join
          secret:
            secretName: nexora-join-token
            defaultMode: 0440
        - name: state
          hostPath: { path: /var/lib/nexora/nexora-engine, type: DirectoryOrCreate }

