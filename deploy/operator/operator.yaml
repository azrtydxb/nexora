---
# Source: nexora-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-operator
  namespace: nexora-operator
  labels:
    app.kubernetes.io/name: nexora-operator
    app.kubernetes.io/instance: nexora-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "main"
    helm.sh/chart: nexora-operator-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-operator
      app.kubernetes.io/instance: nexora-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-operator
        app.kubernetes.io/instance: nexora-operator
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "main"
        helm.sh/chart: nexora-operator-0.1.0
    spec:
      serviceAccountName: nexora-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: 192.168.10.131/azrtydxb/nexora-operator:main
          imagePullPolicy: IfNotPresent
          args:
            - --chart-dir=/charts/nexora
            - --leader-elect=true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
