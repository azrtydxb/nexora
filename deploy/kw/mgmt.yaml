# nexora-mgmt on kw: 2 replicas, GUI/API only over HTTPS on ingress https://nexora.kw.local (plain HTTP
# redirects), gRPC 9443 for engines on the LoadBalancer IP 192.168.10.135 (no HTTP port there, so no
# cleartext cookie login). NEXORA_TAG is substituted by scripts/kw-deploy.sh. Needs the secrets
# nexora-db-app (CNPG), nexora-ca and nexora-dns-tls (see README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-mgmt
  namespace: nexora
  labels: { app.kubernetes.io/name: nexora-mgmt }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-mgmt }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-mgmt }
    spec:
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 65532,
          fsGroup: 65532,
          seccompProfile: { type: RuntimeDefault },
        }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: nexora-mgmt }
      containers:
        - name: mgmt
          image: 192.168.10.131/azrtydxb/nexora-mgmt:NEXORA_TAG
          # kw tags are rebuilt in place (sha-<HEAD> of a working tree), so always pull.
          imagePullPolicy: Always
          args: ["serve"]
          env:
            - name: NEXORA_DATABASE_URL
              valueFrom: { secretKeyRef: { name: nexora-db-app, key: uri } }
            - { name: NEXORA_HTTP_LISTEN, value: ":8080" }
            - { name: NEXORA_GRPC_LISTEN, value: ":9443" }
            - { name: NEXORA_CA_CERT_FILE, value: /etc/nexora/ca/ca.crt }
            - { name: NEXORA_CA_KEY_FILE, value: /etc/nexora/ca/ca.key }
            - name: NEXORA_GRPC_SERVER_NAMES
              value: "nexora-mgmt-grpc.nexora.svc,nexora-mgmt-grpc.nexora.svc.cluster.local,192.168.10.135"
            - { name: NEXORA_PUBLIC_URL, value: "https://nexora.kw.local" }
            - { name: NEXORA_SECURE_COOKIES, value: "true" }
            # The DNS serving certificate pushed to engines for DoT/DoH/DoQ. The kubelet updates a
            # Secret volume in place, so rotating the Secret rotates the certificate without restarts.
            - {
                name: NEXORA_DNS_TLS_CERT_FILE,
                value: /etc/nexora/dns-tls/tls.crt,
              }
            - {
                name: NEXORA_DNS_TLS_KEY_FILE,
                value: /etc/nexora/dns-tls/tls.key,
              }
            - { name: NEXORA_DNS_TLS_RELOAD_INTERVAL, value: 30s }
            - { name: NEXORA_QUERYLOG_BACKEND, value: opensearch }
            - {
                name: NEXORA_OPENSEARCH_URL,
                value: "http://opensearch.nexora.svc.cluster.local:9200",
              }
            - { name: NEXORA_OPENSEARCH_INDEX, value: "nexora-querylog-*" }
            - {
                name: NEXORA_OTLP_ENDPOINT,
                value: "http://nexora-otelcol.nexora.svc.cluster.local:4317",
              }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9443 }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: grpc }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: ca, mountPath: /etc/nexora/ca, readOnly: true }
            - { name: dns-tls, mountPath: /etc/nexora/dns-tls, readOnly: true }
      volumes:
        - name: ca
          secret: { secretName: nexora-ca, defaultMode: 0440 }
        - name: dns-tls
          secret: { secretName: nexora-dns-tls, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-mgmt
  namespace: nexora
spec:
  selector: { app.kubernetes.io/name: nexora-mgmt }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-mgmt-grpc
  namespace: nexora
spec:
  selector: { app.kubernetes.io/name: nexora-mgmt }
  ports: [{ name: grpc, port: 9443, targetPort: grpc }]
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-mgmt-lb
  namespace: nexora
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.135
  selector: { app.kubernetes.io/name: nexora-mgmt }
  # gRPC only: the GUI/API is reachable solely through the TLS ingress, so session cookies never
  # travel in cleartext.
  ports:
    - { name: grpc, port: 9443, targetPort: grpc }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora
  namespace: nexora
  annotations:
    cert-manager.io/cluster-issuer: cluster-ca
    # Plain HTTP answers 308 to https://nexora.kw.local; cookies are Secure.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [nexora.kw.local]
      secretName: nexora-ingress-tls
  rules:
    - host: nexora.kw.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-mgmt
                port: { name: http }
