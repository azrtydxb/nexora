# Nexora's PostgreSQL on kw. CNPG generates the application password into the secret
# nexora-db-app (key `uri` is the connection string nexora-mgmt reads); it is never written down.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nexora-db
  namespace: nexora
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  bootstrap:
    initdb:
      database: nexora
      owner: nexora
  postgresql:
    parameters:
      # A replication slot left behind by a broken replica kept WAL forever and
      # filled the primary's volume (2026-10-09); past 5GB the slot is invalidated instead.
      max_slot_wal_keep_size: 5GB
  storage:
    storageClass: longhorn
    size: 50Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
