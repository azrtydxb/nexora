# OpenTelemetry Collector: engine query-log records fan out to three destinations: OpenSearch (read
# back by nexora-mgmt), ClickHouse (nexora.querylog in deploy/kw/clickhouse.yaml, as nexora_writer)
# and the shared Loki in namespace monitoring (native OTLP endpoint); traces to the cluster Jaeger in
# namespace observability.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-otelcol
  namespace: nexora
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "0.0.0.0:4317" }
    processors:
      batch: { timeout: 1s }
      # OpenSearch cannot map nexora.filter both as a value and as the parent of
      # nexora.filter.list_id / nexora.filter.category: rename it to nexora.filter.result.
      transform/querylog:
        log_statements:
          - context: log
            statements:
              - set(attributes["nexora.filter.result"], attributes["nexora.filter"]) where attributes["nexora.filter"] != nil
              - delete_key(attributes, "nexora.filter")
      # Loki drops entries of one stream with equal timestamp and line: make the line the record's
      # identifying attributes (the attributes themselves arrive as structured metadata).
      transform/loki:
        log_statements:
          - context: log
            statements:
              - set(log.body, Concat([log.attributes["client.address"], log.attributes["dns.question.name"], log.attributes["dns.question.type"], log.attributes["nexora.transport"], log.attributes["nexora.engine.id"]], " "))
    exporters:
      debug: { verbosity: basic }
      opensearch:
        http: { endpoint: "http://opensearch.nexora.svc.cluster.local:9200" }
        logs_index: nexora-querylog-v2
        logs_index_time_format: "yyyy.MM.dd"
      # The table is Nexora's (deploy/clickhouse/querylog.sql, applied by scripts/kw-deploy.sh).
      clickhouse:
        endpoint: "tcp://clickhouse.nexora.svc.cluster.local:9000"
        database: nexora
        logs_table_name: querylog
        username: nexora_writer
        password: "${env:CLICKHOUSE_WRITER_PASSWORD}"
        create_schema: false
        timeout: 5s
        sending_queue: { enabled: true, queue_size: 5000 }
        retry_on_failure: { enabled: true, max_elapsed_time: 300s }
      otlphttp/loki:
        endpoint: "http://loki.monitoring.svc:3100/otlp"
        tls: { insecure: true }
        sending_queue: { enabled: true, queue_size: 5000 }
        retry_on_failure: { enabled: true, max_elapsed_time: 300s }
      otlp/jaeger:
        endpoint: "jaeger.observability.svc:4317"
        tls: { insecure: true }
    service:
      pipelines:
        logs: { receivers: [otlp], processors: [batch, transform/querylog], exporters: [opensearch] }
        logs/clickhouse: { receivers: [otlp], processors: [batch], exporters: [clickhouse] }
        logs/loki: { receivers: [otlp], processors: [batch, transform/loki], exporters: [otlphttp/loki] }
        traces: { receivers: [otlp], processors: [batch], exporters: [otlp/jaeger] }
        metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-otelcol
  namespace: nexora
  labels: { app.kubernetes.io/name: nexora-otelcol }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-otelcol }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-otelcol }
    spec:
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 10001,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: otelcol
          image: 192.168.10.131/otel/opentelemetry-collector-contrib:0.160.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: CLICKHOUSE_WRITER_PASSWORD
              valueFrom:
                {
                  secretKeyRef:
                    { name: nexora-clickhouse, key: writer-password },
                }
          ports: [{ name: otlp-grpc, containerPort: 4317 }]
          readinessProbe: { tcpSocket: { port: otlp-grpc }, periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts: [{ name: conf, mountPath: /conf, readOnly: true }]
      volumes:
        - name: conf
          configMap: { name: nexora-otelcol }
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-otelcol
  namespace: nexora
spec:
  selector: { app.kubernetes.io/name: nexora-otelcol }
  ports: [{ name: otlp-grpc, port: 4317, targetPort: otlp-grpc }]
