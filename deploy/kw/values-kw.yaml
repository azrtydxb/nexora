# kw release (scripts/kw-deploy.sh): helm upgrade --install nexora deploy/helm/nexora -n nexora -f deploy/kw/values-kw.yaml --set image.tag=<tag>
image:
  registry: 192.168.10.131/azrtydxb
  pullPolicy: Always # kw tags are rebuilt in place
mgmt:
  replicas: 2
  publicURL: https://nexora.kw.watteel.lab
  secureCookies: true
  # ingress-nginx runs on the pod network: believe its X-Forwarded-For so the login throttle keys on
  # the real client address.
  extraEnv:
    - { name: NEXORA_TRUSTED_PROXY_CIDRS, value: "10.42.0.0/16" }
  grpcServerNames: [nexora-mgmt-grpc.nexora.svc]
  otlpEndpoint: http://nexora-otelcol.nexora.svc.cluster.local:4317
  ca: { existingSecret: nexora-ca }
  kek: { existingSecret: nexora-kek }
  dnsTLS: { existingSecret: nexora-dns-tls, reloadInterval: 30s }
  querylog:
    backend: opensearch
    opensearch:
      {
        url: "http://opensearch.nexora.svc.cluster.local:9200",
        index: "nexora-querylog-*",
      }
  grpcLoadBalancer: { enabled: true, loadBalancerIP: 192.168.10.135 }
  ingress:
    enabled: true
    name: nexora
    className: nginx
    host: nexora.kw.watteel.lab
    clusterIssuer: cluster-ca
    tlsSecretName: nexora-ingress-tls
database:
  mode: external
  external: { existingSecret: nexora-db-app, key: uri }
engine:
  kind: DaemonSet
  workers: 2
  initImage: 192.168.10.131/library/busybox:1.37
  ports: { dns: 53, metrics: 9153, dot: 853, doh: 443, doq: 853 }
  stateDir: { type: hostPath, hostPathPrefix: /var/lib/nexora }
  # Explicit memory limit: the engine caps its filter index at 50% of the cgroup limit (512 MiB here)
  # and refuses a rebuild that would not fit; every catalog category (5.1M names) needs a 112 MiB index.
  # CPU limit 4: the filter index build uses up to four threads (available_parallelism honours the CFS
  # quota); with 2 CPUs shared with the query workers, builds on the busy control-plane node took 2.1-2.6 s.
  # CPU request 500m: during a rolling update the new engine starts beside the old one on the same
  # node (maxSurge 1), so two requests must fit on a busy control-plane node; the limit of 4 keeps
  # filter index builds fast.
  resources:
    requests: { cpu: 500m, memory: 384Mi }
    limits: { cpu: "4", memory: 1Gi }
  # kube-vip announces the VIPs from a control-plane node; with externalTrafficPolicy Local that
  # node must run the engine behind the address.
  tolerations:
    - {
        key: node-role.kubernetes.io/control-plane,
        operator: Exists,
        effect: NoSchedule,
      }
    - {
        key: node-role.kubernetes.io/master,
        operator: Exists,
        effect: NoSchedule,
      }
  # Two engines, one per DNS server address handed out by DHCP (.136 and .139): each address has
  # exactly one engine as endpoint, pinned to the control-plane node that announces the VIP.
  groups:
    - name: default
      workloadName: nexora-engine
      nodeNamePrefix: ""
      joinTokenSecret: nexora-join-token
      instances:
        - name: a
          node: master-12
          service:
            {
              name: nexora-dns,
              type: LoadBalancer,
              loadBalancerIP: 192.168.10.136,
              externalTrafficPolicy: Local,
            }
        - name: b
          node: master-13
          service:
            {
              name: nexora-dns-2,
              type: LoadBalancer,
              loadBalancerIP: 192.168.10.139,
              externalTrafficPolicy: Local,
            }
metrics:
  serviceMonitor:
    {
      enabled: true,
      namespace: monitoring,
      labels: { release: kps },
      interval: 30s,
    }
  prometheusRule:
    { enabled: true, namespace: monitoring, labels: { release: kps } }
