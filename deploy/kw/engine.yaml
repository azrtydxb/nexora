# nexora-engine on kw: a DaemonSet (one engine per node, control-plane nodes included), DNS, DoT,
# DoH and DoQ on the LoadBalancer IP 192.168.10.136 with externalTrafficPolicy Local, so engines see
# real client addresses. NEXORA_TAG is substituted by scripts/kw-deploy.sh. Needs the secret
# nexora-join-token (created by deploy/kw/bootstrap.sh); the DNS serving certificate arrives over
# the control stream from nexora-mgmt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-engine-config
  namespace: nexora
data:
  engine.toml.tmpl: |
    node_name = "NODE_NAME"
    state_dir = "/var/lib/nexora"
    management_urls = ["https://nexora-mgmt-grpc.nexora.svc.cluster.local:9443"]
    join_token_file = "/etc/nexora/join/join-token"
    listen_udp = ["0.0.0.0:53"]
    listen_tcp = ["0.0.0.0:53"]
    listen_dot = ["0.0.0.0:853"]
    listen_doh = ["0.0.0.0:443"]
    listen_doq = ["0.0.0.0:853"]
    doh_path = "/dns-query"
    proxy_protocol_dot = false
    proxy_protocol_doh = false
    metrics_listen = "0.0.0.0:9153"
    workers = 2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nexora-engine
  namespace: nexora
  labels: { app.kubernetes.io/name: nexora-engine }
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-engine }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-engine }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        # Port 53 without NET_BIND_SERVICE.
        sysctls: [{ name: net.ipv4.ip_unprivileged_port_start, value: "0" }]
      # kube-vip announces the VIP from a control-plane node; with externalTrafficPolicy Local that
      # node must run an engine, so control-plane taints are tolerated.
      tolerations:
        - {
            key: node-role.kubernetes.io/control-plane,
            operator: Exists,
            effect: NoSchedule,
          }
        - {
            key: node-role.kubernetes.io/master,
            operator: Exists,
            effect: NoSchedule,
          }
      initContainers:
        # Pod names are unique and match [a-z0-9-]; the engine enrolls under that name.
        # debt: state is an emptyDir, so a restarted pod enrolls as a new engine (accepted until M5
        # moves engine state to hostPath).
        - name: render-config
          image: 192.168.10.131/library/busybox:1.37
          command:
            - sh
            - -c
            # The join directory is created here: runc cannot make the join secret's mount point
            # inside the read-only config mount.
            - 'mkdir -p /etc/nexora/join && sed "s/NODE_NAME/$(echo "$POD_NAME" | cut -c1-63)/" /tmpl/engine.toml.tmpl > /etc/nexora/engine.toml'
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: tmpl, mountPath: /tmpl, readOnly: true }
            - { name: config, mountPath: /etc/nexora }
      containers:
        - name: engine
          image: 192.168.10.131/azrtydxb/nexora-engine:NEXORA_TAG
          # kw tags are rebuilt in place (sha-<HEAD> of a working tree), so always pull.
          imagePullPolicy: Always
          args: ["--config", "/etc/nexora/engine.toml"]
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: dot, containerPort: 853, protocol: TCP }
            - { name: doq, containerPort: 853, protocol: UDP }
            - { name: doh, containerPort: 443, protocol: TCP }
            - { name: metrics, containerPort: 9153 }
          readinessProbe:
            tcpSocket: { port: dns-tcp }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: config, mountPath: /etc/nexora, readOnly: true }
            - { name: join, mountPath: /etc/nexora/join, readOnly: true }
            - { name: state, mountPath: /var/lib/nexora }
      volumes:
        - name: tmpl
          configMap: { name: nexora-engine-config }
        - name: config
          emptyDir: {}
        - name: join
          secret: { secretName: nexora-join-token, defaultMode: 0440 }
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-dns
  namespace: nexora
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.136
  # Local keeps the client source address (per-client policy and the query log depend on it). kube-vip
  # (ARP) holds the VIP on one control-plane node, and the DaemonSet guarantees an engine there.
  # debt: while the engine on the VIP node restarts, external queries to the VIP are dropped (no
  # failover to other nodes under Local); revisit with BGP or per-service election.
  externalTrafficPolicy: Local
  selector: { app.kubernetes.io/name: nexora-engine }
  ports:
    - { name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP }
    - { name: dot, port: 853, targetPort: dot, protocol: TCP }
    - { name: doq, port: 853, targetPort: doq, protocol: UDP }
    - { name: doh, port: 443, targetPort: doh, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-engine-metrics
  namespace: nexora
spec:
  selector: { app.kubernetes.io/name: nexora-engine }
  ports: [{ name: metrics, port: 9153, targetPort: metrics }]
