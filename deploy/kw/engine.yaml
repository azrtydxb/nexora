# nexora-engine on kw: 3 replicas on distinct nodes, DNS on the LoadBalancer IP 192.168.10.136.
# NEXORA_TAG is substituted by scripts/kw-deploy.sh. Needs the secret nexora-join-token
# (created by deploy/kw/bootstrap.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-engine-config
  namespace: nexora
data:
  engine.toml.tmpl: |
    node_name = "NODE_NAME"
    state_dir = "/var/lib/nexora"
    management_urls = ["https://nexora-mgmt-grpc.nexora.svc.cluster.local:9443"]
    join_token_file = "/etc/nexora/join/join-token"
    listen_udp = ["0.0.0.0:53"]
    listen_tcp = ["0.0.0.0:53"]
    metrics_listen = "0.0.0.0:9153"
    workers = 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-engine
  namespace: nexora
  labels: { app.kubernetes.io/name: nexora-engine }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-engine }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-engine }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        # Port 53 without NET_BIND_SERVICE.
        sysctls: [{ name: net.ipv4.ip_unprivileged_port_start, value: "0" }]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: nexora-engine }
      initContainers:
        # Pod names are unique and match [a-z0-9-]; the engine enrolls under that name.
        # debt: state is an emptyDir, so a restarted pod enrolls as a new engine (accepted for M1).
        - name: render-config
          image: 192.168.10.131/library/busybox:1.37
          command:
            - sh
            - -c
            # The join directory is created here: runc cannot make the join secret's mount point
            # inside the read-only config mount.
            - 'mkdir -p /etc/nexora/join && sed "s/NODE_NAME/$(echo "$POD_NAME" | cut -c1-63)/" /tmpl/engine.toml.tmpl > /etc/nexora/engine.toml'
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: tmpl, mountPath: /tmpl, readOnly: true }
            - { name: config, mountPath: /etc/nexora }
      containers:
        - name: engine
          image: 192.168.10.131/azrtydxb/nexora-engine:NEXORA_TAG
          args: ["--config", "/etc/nexora/engine.toml"]
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: metrics, containerPort: 9153 }
          readinessProbe:
            tcpSocket: { port: dns-tcp }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: config, mountPath: /etc/nexora, readOnly: true }
            - { name: join, mountPath: /etc/nexora/join, readOnly: true }
            - { name: state, mountPath: /var/lib/nexora }
      volumes:
        - name: tmpl
          configMap: { name: nexora-engine-config }
        - name: config
          emptyDir: {}
        - name: join
          secret: { secretName: nexora-join-token, defaultMode: 0440 }
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-dns
  namespace: nexora
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.136
  # debt: Cluster, not Local: kube-vip (ARP, no per-service election) holds the VIP on a control-plane
  # node that may run no engine, where Local would drop queries. Engines therefore see node IPs
  # (inside the default allow list) instead of client IPs; revisit with BGP or per-service election.
  externalTrafficPolicy: Cluster
  selector: { app.kubernetes.io/name: nexora-engine }
  ports:
    - { name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-engine-metrics
  namespace: nexora
spec:
  selector: { app.kubernetes.io/name: nexora-engine }
  ports: [{ name: metrics, port: 9153, targetPort: metrics }]
