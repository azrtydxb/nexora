# An in-cluster BIND primary for the secondary zone bind-demo.kw., which deploy/kw/bootstrap.sh
# creates in Nexora (transfers signed with the TSIG key nexora-demo-xfr. from the Secret
# nexora-demo-tsig, created by scripts/kw-deploy.sh). The fixed ClusterIP is the zone's primary address.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-bind
  namespace: nexora
data:
  named.conf: |
    include "/etc/nexora-bind-key/named.key";
    options {
      directory "/var/cache/bind";
      pid-file none;
      listen-on port 5353 { any; };
      listen-on-v6 { none; };
      recursion no;
      dnssec-validation no;
      allow-query { any; };
      allow-transfer { key "nexora-demo-xfr."; };
      notify no;
    };
    zone "bind-demo.kw." {
      type primary;
      file "/etc/nexora-bind/bind-demo.kw.db";
    };
  bind-demo.kw.db: |
    $TTL 300
    @       SOA   ns1.bind-demo.kw. hostmaster.bind-demo.kw. 2026091401 300 60 86400 60
            NS    ns1.bind-demo.kw.
    ns1     A     192.168.10.136
    www     A     192.0.2.53
            TXT   "served by nexora from a bind primary"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-bind
  namespace: nexora
  labels: { app.kubernetes.io/name: nexora-bind }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: nexora-bind }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nexora-bind }
    spec:
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 65534,
          runAsGroup: 65534,
          fsGroup: 65534,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: named
          image: 192.168.10.131/ubuntu/bind9:9.20-25.04_edge
          command: ["named", "-g", "-c", "/etc/nexora-bind/named.conf"]
          ports:
            - { name: dns-tcp, containerPort: 5353, protocol: TCP }
            - { name: dns-udp, containerPort: 5353, protocol: UDP }
          readinessProbe: { tcpSocket: { port: dns-tcp }, periodSeconds: 5 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: config, mountPath: /etc/nexora-bind, readOnly: true }
            - { name: key, mountPath: /etc/nexora-bind-key, readOnly: true }
            - { name: cache, mountPath: /var/cache/bind }
            - { name: run, mountPath: /run/named }
      volumes:
        - name: config
          configMap: { name: nexora-bind }
        - name: key
          secret:
            {
              secretName: nexora-demo-tsig,
              defaultMode: 0440,
              items: [{ key: named.key, path: named.key }],
            }
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-bind
  namespace: nexora
spec:
  clusterIP: 10.43.200.53
  selector: { app.kubernetes.io/name: nexora-bind }
  ports:
    - { name: dns-tcp, port: 5353, targetPort: dns-tcp, protocol: TCP }
    - { name: dns-udp, port: 5353, targetPort: dns-udp, protocol: UDP }
