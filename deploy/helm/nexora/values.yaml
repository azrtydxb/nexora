image:
  registry: 192.168.10.131/azrtydxb
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

mgmt:
  replicas: 2
  publicURL: ""
  secureCookies: true
  engineCertTTL: 2160h
  rolloutTick: 1s
  grpcServerNames: [] # extra SANs; the gRPC Service names and the load balancer IP are always included
  otlpEndpoint: "" # default: the bundled collector when otelCollector.enabled
  ca:
    existingSecret: "" # required: secret with ca.crt and ca.key (nexora-mgmt ca init)
  kek:
    existingSecret: "" # optional: secret with key "kek" (32 random bytes, base64)
  bootstrapToken:
    existingSecret: "" # optional: secret with key "token" (an nxt_ API token); set by the operator
  dnsTLS:
    existingSecret: "" # optional: kubernetes.io/tls secret for DoT/DoH/DoQ, pushed to engines
    reloadInterval: 30s
  ai:
    # optional: secret with keys base-url, model and api-key (all optional). Without base URL and model
    # the management plane runs no AI. The API key lives only in this Secret, never in values.
    existingSecret: ""
  mcp:
    enabled: false # serve the Model Context Protocol at /mcp on the HTTP listener
    readOnly: true # expose only read-only MCP tools
  querylog:
    backend: builtin # builtin | opensearch
    builtinCapacity: 200000
    opensearch:
      url: ""
      index: nexora-querylog-*
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
  grpcLoadBalancer:
    enabled: false
    loadBalancerIP: ""
  ingress:
    enabled: false
    name: "" # default <prefix>-mgmt
    className: nginx
    host: ""
    clusterIssuer: ""
    tlsSecretName: ""
  pdb:
    minAvailable: 1

database:
  mode: cnpg # cnpg | external
  external:
    existingSecret: "" # secret holding a PostgreSQL connection URI
    key: uri
  cnpg:
    clusterName: nexora-db
    instances: 2
    imageName: ghcr.io/cloudnative-pg/postgresql:17.6
    storageClass: ""
    size: 10Gi
    resources: {}
    antiAffinity: preferred # preferred | required
    primaryUpdateMethod: switchover # switchover | restart
    # Seconds a shutting-down PostgreSQL waits for open client sessions before CNPG switches to a fast
    # shutdown. CNPG's default (180) makes a primary deletion take about three minutes, because the
    # management plane holds pooled sessions open; 30 keeps failover inside the 120 s target. Raise it
    # only when long-running transactions must finish, and keep it well below stopDelay (CNPG: 1800).
    smartShutdownTimeout: 30
    postgresql:
      parameters: {} # string map, e.g. { max_connections: "200" }
    backup:
      enabled: false
      destinationPath: "" # s3://bucket/path
      endpointURL: ""
      serverName: "" # default: clusterName
      s3Credentials:
        existingSecret: ""
        accessKeyIdKey: ACCESS_KEY_ID
        secretAccessKeyKey: ACCESS_SECRET_KEY
      endpointCA:
        existingSecret: ""
        key: ca.crt
      retentionPolicy: 30d
      walCompression: gzip
      dataCompression: gzip
      schedule: "0 0 3 * * *" # six fields, seconds first
      immediate: false
    recovery:
      enabled: false
      sourceServerName: "" # required with enabled: the serverName the backup was archived under
      destinationPath: "" # default: backup.destinationPath
      endpointURL: "" # default: backup.endpointURL
      s3Credentials: # each default: backup.s3Credentials.*
        existingSecret: ""
        accessKeyIdKey: ""
        secretAccessKeyKey: ""
      endpointCA: # each default: backup.endpointCA.*
        existingSecret: ""
        key: ""
      targetTime: "" # RFC 3339; empty recovers to the end of the WAL archive

engine:
  enabled: true
  kind: DaemonSet # DaemonSet | Deployment
  # Opt-in pair upgrades: freeze all DaemonSets except the named workload.
  # PDBs alone do not constrain DaemonSet rolling updates.
  pairedRollout:
    enabled: false
    workload: ""
    legacySelectors: false # migration only: retain each pair's first member selector
  managementURL: "" # default https://<prefix>-mgmt-grpc.<namespace>.svc.cluster.local:9443
  workers: 2
  initImage: busybox:1.37
  # hostNetwork binds the engine ports on the node itself. The pod then cannot set the namespaced
  # sysctl net.ipv4.ip_unprivileged_port_start, so the node's value must be at or below the lowest
  # engine port (the engine runs as uid 10001), and engine groups must not share a node.
  hostNetwork: false
  ports: { dns: 53, metrics: 9153, dot: 0, doh: 0, doq: 0 } # 0 disables an encrypted listener
  dohPath: /dns-query
  stateDir:
    type: hostPath # hostPath | emptyDir (emptyDir enrolls again after every pod restart)
    hostPathPrefix: /var/lib/nexora
  tolerations: []
  # After SIGTERM an engine reports not ready and keeps serving this long, so the Service moves
  # clients to the new engine before the old one stops accepting (terminationGracePeriodSeconds is
  # this plus 15). With the rolling update (maxSurge 1) each node's new engine must fit next to the
  # old one: the node needs room for a second copy of resources.requests.
  shutdownDrainSeconds: 15
  # How long a new engine must stay ready before the old one on that node is stopped.
  minReadySeconds: 5
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }
  groups:
    - name: default
      workloadName: "" # default <prefix>-engine-<name>
      nodeNamePrefix: "" # NEXORA_ENGINE_NODE_NAME = <nodeNamePrefix><Kubernetes node name>
      replicas: 1 # Deployment only
      nodeAffinity: {}
      joinTokenSecret: ""
      joinTokenKey: join-token
      service:
        name: "" # default <prefix>-dns-<name>
        type: LoadBalancer
        loadBalancerIP: ""
        externalTrafficPolicy: Local
      # extraServices: [{ name, type, loadBalancerIP, externalTrafficPolicy }] more addresses for the group.
      #
      # instances: one engine per entry, pinned to one node, instead of one workload for the group.
      # Each renders workload <workloadName>-<name> (pod label nexora.io/engine-instance: <name>, node
      # affinity kubernetes.io/hostname In [node], added to nodeAffinity) with the group's ConfigMap
      # and state directory, and its optional service selects only that engine. With instances the
      # group service and extraServices render only when set.
      #   instances:
      #     - { name: a, node: node-1, service: { name: dns-a, loadBalancerIP: 192.0.2.1 } }
      # Instances may override stateDirName and nodeNamePrefix to isolate colocated identities.
      instances: []
      # failoverPairs: [{ name: dns-a, members: [a, c], service: { name: dns-a, loadBalancerIP: 192.0.2.1 } }]
      failoverPairs: []

# An OpenTelemetry Collector for engine query logs, traces and metrics. Off by default; when on and
# mgmt.otlpEndpoint is empty, mgmt (and through it the engines) sends OTLP to it.
otelCollector:
  enabled: false
  image: otel/opentelemetry-collector-contrib:0.160.0
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  # Collector configuration; the receiver must listen on 0.0.0.0:4317.
  config: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "0.0.0.0:4317" }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 400 }
      batch: {}
    exporters:
      debug: { verbosity: basic }
    service:
      pipelines:
        logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }

metrics:
  serviceMonitor: { enabled: false, namespace: "", labels: {}, interval: 30s }
  prometheusRule: { enabled: false, namespace: "", labels: {} }
