{{- if .Values.engine.enabled }}
{{- $prefix := include "nexora.prefix" . }}
{{- $p := .Values.engine.ports }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $prefix }}-engine-metrics
  labels:
    {{- include "nexora.labels" (dict "root" . "name" "nexora-engine") | nindent 4 }}
    nexora.io/metrics: "true"
spec:
  selector: {{- include "nexora.selectorLabels" (dict "root" . "name" "nexora-engine") | nindent 4 }}
  ports:
    - { name: metrics, port: {{ $p.metrics }}, targetPort: metrics }
{{- range $g := .Values.engine.groups }}
{{- $main := $g.service | default dict }}
{{- $defaultName := printf "%s-dns-%s" $prefix $g.name }}
{{- /* Group Services select every engine of the group. extraServices: more addresses for the same
     group (e.g. a second DNS server IP for clients). With instances, group Services are optional. */}}
{{- $all := list }}
{{- if or (not $g.instances) $g.service }}
{{- $all = append $all (dict "svc" (merge (dict "name" ($main.name | default $defaultName)) $main) "instance" "") }}
{{- end }}
{{- range $x := $g.extraServices | default list }}
{{- $all = append $all (dict "svc" $x "instance" "") }}
{{- end }}
{{- /* An instance Service only has that instance's engine as endpoint. */}}
{{- range $i := $g.instances | default list }}
{{- with $i.service }}
{{- $all = append $all (dict "svc" . "instance" $i.name) }}
{{- end }}
{{- end }}
{{- range $p := $g.failoverPairs | default list }}
{{- $instance := "" }}
{{- $pair := $p.name }}
{{- if $.Values.engine.pairedRollout.legacySelectors }}
{{- $instance = first $p.members }}
{{- $pair = "" }}
{{- end }}
{{- $all = append $all (dict "svc" $p.service "instance" $instance "pair" $pair) }}
{{- end }}
{{- range $entry := $all }}
{{- $svc := $entry.svc }}
{{- $type := $svc.type | default ($main.type | default "LoadBalancer") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ required "every engine group service needs a name" $svc.name }}
  labels:
    {{- include "nexora.labels" (dict "root" $ "name" "nexora-engine") | nindent 4 }}
    nexora.io/engine-group: {{ $g.name }}
    {{- with $entry.instance }}
    nexora.io/engine-instance: {{ . }}
    {{- end }}
spec:
  type: {{ $type }}
  {{- with $svc.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- if ne $type "ClusterIP" }}
  # Local keeps client source addresses (per-client policy, query log); the node announcing a
  # LoadBalancer address must then run an engine of this group.
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy | default ($main.externalTrafficPolicy | default "Local") }}
  {{- end }}
  selector:
    {{- include "nexora.selectorLabels" (dict "root" $ "name" "nexora-engine") | nindent 4 }}
    nexora.io/engine-group: {{ $g.name }}
    {{- with $entry.pair }}
    nexora.io/failover-pair: {{ . }}
    {{- end }}
    {{- with $entry.instance }}
    nexora.io/engine-instance: {{ . }}
    {{- end }}
  ports:
    - { name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP }
    {{- if $p.dot }}
    - { name: dot, port: 853, targetPort: dot, protocol: TCP }
    {{- end }}
    {{- if $p.doq }}
    - { name: doq, port: 853, targetPort: doq, protocol: UDP }
    {{- end }}
    {{- if $p.doh }}
    - { name: doh, port: 443, targetPort: doh, protocol: TCP }
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
