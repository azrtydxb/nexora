{{- if .Values.metrics.prometheusRule.enabled }}
{{- if not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- fail "metrics.prometheusRule.enabled needs the Prometheus Operator CRDs (API monitoring.coreos.com/v1)" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nexora.prefix" . }}
  namespace: {{ default .Release.Namespace .Values.metrics.prometheusRule.namespace }}
  labels:
    {{- include "nexora.labels" (dict "root" . "name" "nexora") | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: nexora-fleet
      rules:
        - alert: NexoraEngineDisconnected
          expr: max(nexora_mgmt_engines_disconnected{namespace="{{ .Release.Namespace }}"}) > 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ `{{ $value }}` }} Nexora engine(s) without a control stream for more than 60 seconds"
        - alert: NexoraRolloutHalted
          expr: max(nexora_mgmt_rollouts{state="halted",namespace="{{ .Release.Namespace }}"}) > 0
          labels: { severity: warning }
          annotations:
            summary: A Nexora configuration rollout halted on its health gate; roll back or fix forward
        - alert: NexoraManagementPlaneDown
          expr: absent(up{namespace="{{ .Release.Namespace }}",service="{{ include "nexora.prefix" . }}-mgmt"} == 1)
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No Nexora management plane instance is being scraped
    - name: nexora-ai
      rules:
        # 21600 s is the 6 h default agent interval: the alert fires once an agent has failed in the last
        # hour and has not succeeded for three default intervals.
        - alert: NexoraAIAgentFailing
          expr: increase(nexora_mgmt_ai_agent_runs_total{outcome="failed"}[1h]) > 0 and (time() - nexora_mgmt_ai_agent_last_success_timestamp_seconds) > 3 * 21600
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Nexora AI agent {{ `{{ $labels.agent }}` }} keeps failing and has not succeeded for three intervals"
        - alert: NexoraAIBudgetExhausted
          expr: nexora_mgmt_ai_budget_used_ratio >= 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: The Nexora AI daily token budget is spent; AI requests answer ai_budget_exhausted until the UTC day ends
{{- end }}
