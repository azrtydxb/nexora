{{- if .Values.engine.enabled }}
{{- $e := .Values.engine }}
{{- range $g := $e.groups }}
{{- $workload := include "nexora.engineWorkload" (dict "root" $ "group" $g) }}
---
apiVersion: apps/v1
kind: {{ $e.kind }}
metadata:
  name: {{ $workload }}
  labels:
    {{- include "nexora.labels" (dict "root" $ "name" "nexora-engine") | nindent 4 }}
    nexora.io/engine-group: {{ $g.name }}
spec:
  {{- if eq $e.kind "Deployment" }}
  replicas: {{ ternary $g.replicas 1 (hasKey $g "replicas") }}
  # Never two engines of one group on the same state directory (hostPath) at once.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  {{- else }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1 }
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexora.selectorLabels" (dict "root" $ "name" "nexora-engine") | nindent 6 }}
      nexora.io/engine-group: {{ $g.name }}
  template:
    metadata:
      labels:
        {{- include "nexora.labels" (dict "root" $ "name" "nexora-engine") | nindent 8 }}
        nexora.io/engine-group: {{ $g.name }}
      annotations:
        checksum/config: {{ include "nexora.engineToml" (dict "root" $ "group" $g) | sha256sum }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $e.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
        {{- if not $e.hostNetwork }}
        # Port 53 without NET_BIND_SERVICE (a namespaced sysctl, unavailable with hostNetwork).
        sysctls: [{ name: net.ipv4.ip_unprivileged_port_start, value: "0" }]
        {{- end }}
      {{- with $g.nodeAffinity }}
      affinity:
        nodeAffinity: {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with $e.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $e.stateDir.type "hostPath" }}
      initContainers:
        # The hostPath directory is created root-owned; hand it to the engine user.
        - name: state-owner
          image: {{ $e.initImage }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "-c", "chown 10001:10001 /var/lib/nexora && chmod 0700 /var/lib/nexora"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [CHOWN, FOWNER] }
          volumeMounts:
            - { name: state, mountPath: /var/lib/nexora }
      {{- end }}
      containers:
        - name: engine
          image: {{ include "nexora.image" (dict "root" $ "name" "nexora-engine") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["--config", "/etc/nexora/engine.toml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # A stable name per node and group, so a restarted pod keeps its engine identity.
            - name: NEXORA_ENGINE_NODE_NAME
              value: {{ printf "%s$(K8S_NODE_NAME)" ($g.nodeNamePrefix | default "") | quote }}
          ports:
            - { name: dns-udp, containerPort: {{ $e.ports.dns }}, protocol: UDP }
            - { name: dns-tcp, containerPort: {{ $e.ports.dns }}, protocol: TCP }
            {{- with $e.ports.dot }}
            - { name: dot, containerPort: {{ . }}, protocol: TCP }
            {{- end }}
            {{- with $e.ports.doq }}
            - { name: doq, containerPort: {{ . }}, protocol: UDP }
            {{- end }}
            {{- with $e.ports.doh }}
            - { name: doh, containerPort: {{ . }}, protocol: TCP }
            {{- end }}
            - { name: metrics, containerPort: {{ $e.ports.metrics }}, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: dns-tcp }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          resources: {{- toYaml $e.resources | nindent 12 }}
          securityContext: {{- include "nexora.containerSecurity" $ | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/nexora/engine.toml, subPath: engine.toml, readOnly: true }
            - { name: join, mountPath: /etc/nexora/join, readOnly: true }
            - { name: state, mountPath: /var/lib/nexora }
      volumes:
        - name: config
          configMap: { name: {{ $workload }} }
        - name: join
          secret:
            secretName: {{ required (printf "engine.groups[%s].joinTokenSecret is required" $g.name) $g.joinTokenSecret }}
            defaultMode: 0440
        - name: state
          {{- if eq $e.stateDir.type "hostPath" }}
          hostPath: { path: {{ printf "%s/%s" (trimSuffix "/" $e.stateDir.hostPathPrefix) $workload }}, type: DirectoryOrCreate }
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
{{- end }}
