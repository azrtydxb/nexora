{{- $prefix := include "nexora.prefix" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $prefix }}-mgmt
  labels:
    {{- include "nexora.labels" (dict "root" . "name" "nexora-mgmt") | nindent 4 }}
    nexora.io/metrics: "true"
spec:
  selector: {{- include "nexora.selectorLabels" (dict "root" . "name" "nexora-mgmt") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $prefix }}-mgmt-grpc
  labels: {{- include "nexora.labels" (dict "root" . "name" "nexora-mgmt") | nindent 4 }}
spec:
  selector: {{- include "nexora.selectorLabels" (dict "root" . "name" "nexora-mgmt") | nindent 4 }}
  ports:
    - { name: grpc, port: 9443, targetPort: grpc }
{{- if .Values.mgmt.grpcLoadBalancer.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $prefix }}-mgmt-lb
  labels: {{- include "nexora.labels" (dict "root" . "name" "nexora-mgmt") | nindent 4 }}
    {{- with .Values.mgmt.grpcLoadBalancer.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.mgmt.grpcLoadBalancer.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.mgmt.grpcLoadBalancer.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  {{- with .Values.mgmt.grpcLoadBalancer.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  selector: {{- include "nexora.selectorLabels" (dict "root" . "name" "nexora-mgmt") | nindent 4 }}
  # gRPC only: the GUI/API is never reachable in cleartext here, so session cookies stay on TLS.
  ports:
    - { name: grpc, port: 9443, targetPort: grpc }
{{- end }}
