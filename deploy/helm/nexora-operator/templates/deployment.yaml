apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexora-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "nexora-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexora-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: nexora-operator
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ printf "%s/nexora-operator:%s" .Values.image.registry (.Values.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --chart-dir=/charts/nexora
            - --leader-elect={{ .Values.leaderElection }}
            {{- if eq .Values.rbac.scope "namespace" }}
            - --watch-namespaces={{ join "," .Values.watchNamespaces }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
